# pnpm workspace definition. The npm `workspaces` array in package.json is left in
# place because other tooling still reads it (the OpenApp install engine's
# findWorkspacePackageJsonFiles, and the publish workflow's jq steps) — pnpm itself
# ignores it and uses this file. Keep the two glob lists in sync.

# LOAD-BEARING. pnpm 10 defaults this to false, which makes internal deps pinned at
# an exact version resolve from the REGISTRY instead of linking to the local package.
# For an unpublished version that fails loudly; for a published one it silently
# installs a stale copy. This repo pins its own workspace packages at exact
# versions, so without this every workspace link becomes a registry download.
linkWorkspacePackages: true

# Peer handling (strict-peer-dependencies, auto-install-peers) lives in .npmrc.

# pnpm 10 does not run dependency build scripts unless they are allowlisted here.
# Anything omitted installs without its native/postinstall step and fails later at
# runtime rather than at install. Kept verbatim in sync with the MJ core allowlist
# rather than trimmed to today's tree: entries for absent packages are inert, and a
# trimmed list silently regresses the moment a transitive dep reappears.
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@google/genai'
  - '@parcel/watcher'
  - '@zoom/rtms'
  - browser-tabs-lock
  - core-js
  - core-js-pure
  - esbuild
  - isolated-vm
  - lmdb
  - msgpackr-extract
  - oracledb
  - protobufjs
  - rete
  - sharp
  - tesseract.js

packages:
  - 'packages/*'

# Moved from package.json's npm `overrides` (pnpm ignores npm's). MJ pins updated
# 5.50 -> 6.1.0-edge.2, the edge release carrying the MJ#3734 UserCache move (the stale
# 5.50 pins were orders#60's root cause; the apps/ tree they held together is deleted).
overrides:
  "@angular/animations": "21.1.3"
  "@angular/build": "21.1.3"
  "@angular/cli": "21.1.3"
  "@angular/common": "21.1.3"
  "@angular/compiler": "21.1.3"
  "@angular/compiler-cli": "21.1.3"
  "@angular/core": "21.1.3"
  "@angular/forms": "21.1.3"
  "@angular/localize": "21.1.3"
  "@angular/platform-browser": "21.1.3"
  "@angular/platform-browser-dynamic": "21.1.3"
  "@angular/router": "21.1.3"
  "@angular-devkit/build-angular": "21.1.3"
  "@memberjunction/core": "^6.1.0-edge.2"
  "@memberjunction/global": "^6.1.0-edge.2"
  "graphql": "16.14.2"
  "type-graphql": "2.0.0-beta.3"
  "reflect-metadata": "0.2.2"
