<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotions — MJ Orders</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .pm-stack { display: grid; grid-template-columns: 1fr 1fr; gap: var(--mj-space-4); }
  .pm-calc {
    font-family: var(--mj-font-family-mono); font-size: 11.5px;
    background: var(--mj-bg-surface-sunken); border-radius: var(--mj-radius-sm);
    padding: var(--mj-space-3); line-height: 1.8;
  }
  @media (max-width: 900px) { .pm-stack { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<template id="page">

  <div slot="meta"><span class="mj-chip mj-chip--outline" id="pm-count">—</span></div>

  <div slot="actions">
    <button class="mj-btn mj-btn--outline"><i class="fa-solid fa-gear"></i> Stacking policy</button>
    <button class="mj-btn mj-btn--primary"><i class="fa-solid fa-plus"></i> New promotion</button>
  </div>

  <div slot="body">
    <div class="mock-note">
      A <b>promotion</b> is the offer; a <b>code</b> is a redeemable string pointing at it. Keeping them separate is
      what lets one offer have several codes — a partner code, a conference code, a win-back code — all reporting
      into the same offer, and it maps one-to-one onto how the payment provider already models it.
    </div>

    <div class="mj-table-wrap">
      <table class="mj-table">
        <thead><tr><th>Promotion</th><th style="width:120px">Code</th><th style="width:110px">Value</th>
          <th style="width:90px">Scope</th><th>Applies to</th><th style="width:170px">Window</th>
          <th class="num" style="width:110px">Redeemed</th><th style="width:96px">Status</th></tr></thead>
        <tbody id="pm-rows" data-on-row="pmOpen" data-single-select></tbody>
      </table>
    </div>

    <div class="pm-stack" style="margin-top:var(--mj-space-6)">
      <div class="mj-card">
        <div class="mj-card-head"><i class="fa-solid fa-layer-group"></i><h3>Stacking — configured per company</h3></div>
        <div class="mj-card-pad">
          <div id="pm-stacking"></div>
          <div class="sec-label" style="margin-top:var(--mj-space-4)">Two 10% offers on $400</div>
          <div class="pm-stack">
            <div>
              <div class="row"><b>Sequential</b><span class="mj-chip mj-chip--brand spacer">default</span></div>
              <div class="pm-calc" style="margin-top:6px">
                400.00<br>
                − 40.00 &nbsp;<span style="color:var(--mj-text-muted)">(10% of 400)</span><br>
                = 360.00<br>
                − 36.00 &nbsp;<span style="color:var(--mj-text-muted)">(10% of 360)</span><br>
                <b>= 324.00</b> &nbsp;<span style="color:var(--mj-text-muted)">→ 19%</span>
              </div>
            </div>
            <div>
              <div class="row"><b>Additive</b></div>
              <div class="pm-calc" style="margin-top:6px">
                400.00<br>
                − 80.00 &nbsp;<span style="color:var(--mj-text-muted)">(10% + 10% of 400)</span><br>
                <br>
                <br>
                <b>= 320.00</b> &nbsp;<span style="color:var(--mj-text-muted)">→ 20%</span>
              </div>
            </div>
          </div>
          <div class="small muted" style="margin-top:var(--mj-space-3)">
            Sequential is the default because it discounts <b>less</b>. When two configurations are both defensible,
            the safer one should be what happens when nobody chose.
          </div>
        </div>
      </div>

      <div class="mj-card">
        <div class="mj-card-head"><i class="fa-solid fa-scale-balanced"></i><h3>When two offers collide</h3></div>
        <div class="mj-card-pad">
          <div class="small">
            If neither stacks, the <b>higher value wins</b> — and the loser is recorded as
            <i>offered but not applied</i>, with the reason.
          </div>
          <table class="mj-table mj-table--compact" style="margin-top:var(--mj-space-3)">
            <thead><tr><th>Code</th><th class="num">Would give</th><th>Outcome</th></tr></thead>
            <tbody>
              <tr><td class="mono">SUMMIT26</td><td class="num">$154.95</td>
                <td><span class="mj-chip mj-chip--success">applied</span></td></tr>
              <tr><td class="mono">MEMBER40</td><td class="num">$40.00</td>
                <td><span class="mj-chip mj-chip--outline">offered, not applied</span>
                  <div class="secondary">lower value, neither stacks</div></td></tr>
            </tbody>
          </table>
          <div class="mj-banner mj-banner--info" style="margin-top:var(--mj-space-3)">
            <i class="fa-solid fa-circle-info"></i>
            <div class="body">Recording the loser is not bookkeeping trivia — it is the only way to answer
            &ldquo;why didn't my code work?&rdquo; without re-running the engine by hand, and the customer
            <i>will</i> ask.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="mj-card" style="margin-top:var(--mj-space-4)">
      <div class="mj-card-head"><i class="fa-solid fa-user-shield"></i><h3>Manual discounts and authority</h3></div>
      <div class="mj-card-pad">
        <div class="grid-2">
          <div>
            <div class="sec-label">Rep authority</div>
            <table class="mj-table mj-table--compact">
              <thead><tr><th>Rep</th><th class="num">Max discount</th><th class="num">Max order</th>
                <th>Over the cap</th></tr></thead>
              <tbody>
                <tr><td>Alicia Fontaine</td><td class="num">15%</td><td class="num">$25,000</td>
                  <td class="small">Escalates to Sales Manager</td></tr>
                <tr><td>Devon Price</td><td class="num">10%</td><td class="num">$10,000</td>
                  <td class="small">Escalates to Sales Manager</td></tr>
                <tr><td>Sales Manager</td><td class="num">30%</td><td class="num">$100,000</td>
                  <td class="small">Escalates to Controller</td></tr>
              </tbody>
            </table>
          </div>
          <div>
            <div class="sec-label">Why escalation, not refusal</div>
            <div class="small">
              A manual discount over the cap raises an approval task for the named role and stamps the approval on
              the order. It is not refused — a legitimate exception should be <i>possible</i> and <i>recorded</i>,
              not impossible.
            </div>
            <div class="mj-banner mj-banner--warning" style="margin-top:var(--mj-space-3)">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <div class="body"><strong>The absence of an authority record is not permission.</strong> A rep with no
              authority row has a cap of zero, not an unlimited one. This was shipped the wrong way round once —
              over-cap discounts applied silently until a review caught it.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div slot="overlays">
    <aside class="mj-slide-in" id="pm-detail">
      <div class="mj-slide-in-head">
        <div><h2 id="pmd-title">—</h2><div class="small muted" id="pmd-sub"></div></div>
        <span class="right"><button class="mj-iconbtn" data-close><i class="fa-solid fa-xmark"></i></button></span>
      </div>
      <div class="mj-slide-in-body" id="pmd-body"></div>
      <div class="mj-slide-in-foot">
        <button class="mj-btn mj-btn--primary mj-btn--sm" data-close>Save</button>
        <button class="mj-btn mj-btn--flat mj-btn--sm" data-close>Cancel</button>
      </div>
    </aside>
  </div>
</template>

<script src="../assets/data.js"></script>
<script src="../assets/shell.js"></script>
<script>
const H = MJ.H;

function render() {
  const active = DB.promotions.filter(p => p.status === 'Active').length;
  document.getElementById('pm-count').textContent = `${active} active of ${DB.promotions.length}`;

  document.getElementById('pm-rows').innerHTML = DB.promotions.map(p => `
    <tr class="is-clickable" data-row="${p.id}">
      <td><span class="primary">${p.name}</span></td>
      <td><span class="mono strong">${p.code}</span></td>
      <td class="strong">${p.kind === 'Percent' ? F.pct(p.value) : F.money(p.value)}
        <div class="secondary">${p.kind.toLowerCase()}</div></td>
      <td><span class="mj-chip mj-chip--outline">${p.scope}</span></td>
      <td class="small">${p.target}</td>
      <td class="small">${F.dateShort(p.from)} → ${F.dateShort(p.to)}</td>
      <td class="num">${p.redemptions}
        ${p.cap ? `<div class="secondary">of ${p.cap}</div>` : ''}</td>
      <td>${p.status === 'Active' ? '<span class="mj-chip mj-chip--success">Active</span>'
        : '<span class="mj-chip mj-chip--outline">Expired</span>'}</td>
    </tr>`).join('');

  document.getElementById('pm-stacking').innerHTML = Object.entries(DB.stackingPolicy).map(([co, mode]) => `
    <div class="row" style="padding:var(--mj-space-2) 0;border-bottom:1px solid var(--mj-border-subtle)">
      <span>${DB.companies[co].name}</span>
      <span class="spacer mj-chip ${mode === 'Sequential' ? 'mj-chip--brand' : 'mj-chip--info'}">${mode}</span>
    </div>`).join('') + `
    <div class="small muted" style="margin-top:var(--mj-space-2)">
      Per company, because the same offer can be run by two subsidiaries under different commercial policy.
    </div>`;
}

function pmOpen(id) {
  const p = DB.promotions.find(x => x.id === id);
  document.getElementById('pmd-title').textContent = p.name;
  document.getElementById('pmd-sub').innerHTML = `<span class="mono">${p.code}</span> · ${p.scope}-scoped`;
  document.getElementById('pmd-body').innerHTML = `
    <div class="sec-label">The offer</div>
    <div class="grid-2">
      <div class="mj-field"><label>Name</label><input class="mj-input" value="${p.name}"></div>
      <div class="mj-field"><label>Discount kind</label>
        <select class="mj-select"><option ${p.kind === 'Percent' ? 'selected' : ''}>Percent</option>
          <option ${p.kind === 'Fixed' ? 'selected' : ''}>Fixed amount</option></select></div>
      <div class="mj-field"><label>Value</label>
        <input class="mj-input is-num" value="${p.kind === 'Percent' ? (p.value * 100).toFixed(0) : p.value.toFixed(2)}"></div>
      <div class="mj-field"><label>Scope</label>
        <select class="mj-select"><option ${p.scope === 'Line' ? 'selected' : ''}>Line</option>
          <option ${p.scope === 'Order' ? 'selected' : ''}>Order</option></select>
        <div class="hint">${p.scope === 'Order'
          ? 'An order-level discount MUST allocate to the lines — tax and GL both operate on line amounts.'
          : 'Applies to matching lines only.'}</div></div>
      <div class="mj-field"><label>From</label><input class="mj-input" type="date" value="${p.from}"></div>
      <div class="mj-field"><label>To</label><input class="mj-input" type="date" value="${p.to}"></div>
    </div>

    <div class="mj-field"><label>Applies to</label><input class="mj-input" value="${p.target}"></div>
    <div class="mj-field"><label>Redemption cap</label>
      <input class="mj-input is-num" value="${p.cap || ''}" placeholder="unlimited">
      <div class="hint">${p.cap ? `${p.redemptions} of ${p.cap} used.` : 'No cap set.'}</div></div>

    <div class="sec-label" style="margin-top:var(--mj-space-4)">Codes pointing at this offer</div>
    <table class="mj-table mj-table--compact">
      <thead><tr><th>Code</th><th class="num">Redeemed</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td class="mono">${p.code}</td><td class="num">${p.redemptions}</td>
          <td><span class="mj-chip ${p.status === 'Active' ? 'mj-chip--success' : 'mj-chip--outline'}">${p.status}</span></td></tr>
      </tbody>
    </table>
    <button class="mj-btn mj-btn--flat mj-btn--sm" style="margin-top:var(--mj-space-2)">
      <i class="fa-solid fa-plus"></i> Add another code</button>
    <div class="small muted" style="margin-top:var(--mj-space-2)">
      Several codes can point at one offer — a partner code and a conference code that report into the same
      promotion rather than into two offers whose numbers have to be added up by hand.
    </div>

    <div class="sec-label" style="margin-top:var(--mj-space-4)">Recent redemptions</div>
    <table class="mj-table mj-table--compact">
      <tbody>
        <tr><td><a class="mono" href="../orders/document.html">ORD-1005</a></td>
          <td class="small">Meridian Association</td><td class="num">−$40.00</td></tr>
        <tr><td><a class="mono" href="../orders/editor.html">ORD-1016</a></td>
          <td class="small">Meridian Association</td><td class="num">−$40.00</td></tr>
      </tbody>
    </table>

    <div class="mock-note">The provider owns configuration and application at launch, and orders records the
      outcome — at both the order level (code, provider, total) and the line level, because providers prorate and
      tax and GL need line amounts.</div>`;

  MJ.open('#pm-detail');
}

MJ.mount({
  nav: 'catalog', rail: 'promotions',
  title: 'Promotions',
  icon: 'fa-solid fa-percent',
  subtitle: 'Offers, the codes that redeem them, and how they stack',
  ready: render,
});
</script>
</body>
</html>
