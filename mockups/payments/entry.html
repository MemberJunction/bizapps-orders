<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take a payment — MJ Orders</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .pe-unalloc {
    position: sticky; bottom: 0; display: flex; align-items: center; gap: var(--mj-space-3);
    padding: var(--mj-space-3) var(--mj-space-4);
    border-top: 2px solid var(--mj-border-strong); background: var(--mj-bg-surface);
  }
  .pe-unalloc .v { font-size: 20px; font-weight: var(--mj-font-bold); font-variant-numeric: tabular-nums; }
  .pe-unalloc.is-zero { background: var(--mj-status-success-bg); border-top-color: var(--mj-status-success); }
  .pe-unalloc.is-zero .v { color: var(--mj-status-success-text); }
  .pe-unalloc.is-over { background: var(--mj-status-error-bg); border-top-color: var(--mj-status-error); }
  .pe-unalloc.is-over .v { color: var(--mj-status-error-text); }
  .pe-alloc-input { width: 110px; }
  .pe-late { font-size: 11px; color: var(--mj-status-error-text); font-weight: var(--mj-font-semibold); }
</style>
</head>
<body>

<template id="page">

  <div slot="meta"><span class="mj-chip">Pending</span><span class="mj-chip mj-chip--outline">not captured</span></div>

  <div slot="actions">
    <button class="mj-btn mj-btn--outline">Save as pending</button>
    <button class="mj-btn mj-btn--primary" id="pe-capture" data-open="#pe-confirm">
      <i class="fa-solid fa-check"></i> Capture payment</button>
  </div>

  <div slot="body">
    <div class="mock-note">
      A payment's amount must equal the sum of what it settles — so the running <b>unallocated</b> figure is the
      centre of this screen, and capture is unavailable until it reads zero. That check happens at capture, not on
      every keystroke: a pending payment is a draft, exactly as a draft order may have no lines yet.
    </div>

    <div class="mj-split">

      <!-- ══ LEFT: the payment itself ══ -->
      <div class="left">
        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-hand-holding-dollar"></i><h3>The money</h3></div>
          <div class="mj-card-pad">
            <div class="mj-field"><label>From</label>
              <div class="mjo-search"><i class="fa-solid fa-magnifying-glass"></i>
                <input id="pe-cust" value="Meridian Association" autocomplete="off"></div>
              <div class="hint" id="pe-cust-hint"></div></div>

            <div class="grid-2">
              <div class="mj-field"><label>Amount received</label>
                <input class="mj-input is-num" id="pe-amount" value="7,076.77"></div>
              <div class="mj-field"><label>Date received</label>
                <input class="mj-input" type="date" value="2026-07-29"></div>
            </div>

            <div class="mj-field"><label>Tender</label>
              <select class="mj-select" id="pe-type">
                <option value="Check" selected>Check</option>
                <option value="Card">Credit card</option>
                <option value="ACH">ACH / bank</option>
                <option value="Wire">Wire transfer</option>
                <option value="AccountCredit">Account credit</option>
              </select>
              <div class="hint">Reversal types are absent because the data says they are reversals — not because
                this list hardcodes an exclusion.</div></div>

            <div id="pe-instrument"></div>

            <div class="mj-field"><label>Receiving company</label>
              <select class="mj-select"><option>Sidecar Learning, Inc.</option>
                <option>Sidecar Events, LLC</option><option>Blue Cypress Media, LLC</option></select>
              <div class="hint">Where the cash actually landed — which is not necessarily who earned it.</div></div>
          </div>
        </div>

        <div class="mj-card" style="margin-top:var(--mj-space-4)">
          <div class="mj-card-head"><i class="fa-solid fa-scale-balanced"></i><h3>What this will book</h3></div>
          <div class="mj-card-pad" id="pe-je"></div>
        </div>
      </div>

      <!-- ══ RIGHT: allocation ══ -->
      <div class="right">
        <div class="mj-card">
          <div class="mj-card-head">
            <i class="fa-solid fa-list-check"></i><h3>Apply it to open orders</h3>
            <span class="right">
              <button class="mj-btn mj-btn--outline mj-btn--sm" onclick="PE.auto()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-apply oldest first</button>
              <button class="mj-btn mj-btn--flat mj-btn--sm" onclick="PE.clear()">Clear</button>
            </span>
          </div>

          <table class="mj-table mj-table--compact">
            <thead>
              <tr><th style="width:104px">Order</th><th>Memo</th>
                <th style="width:96px">Due</th><th style="width:56px">Co.</th>
                <th class="num" style="width:112px">Balance</th>
                <th class="num" style="width:130px">Apply</th>
                <th class="num" style="width:120px">Leaves</th></tr>
            </thead>
            <tbody id="pe-rows"></tbody>
          </table>

          <div class="pe-unalloc" id="pe-unalloc">
            <div>
              <div class="sec-label" style="margin:0">Unallocated</div>
              <div class="small muted" id="pe-unalloc-note">Must reach zero to capture.</div>
            </div>
            <span class="spacer v" id="pe-unalloc-v">—</span>
          </div>
        </div>

        <div id="pe-effects" class="stack-3" style="margin-top:var(--mj-space-4)"></div>

        <div class="mock-note">
          Over-applying an order is <b>not</b> an error. It drives that order's balance negative, and that negative
          balance <i>is</i> the customer's credit — spendable on another order. Refusing it would make an everyday
          event unrecordable while the money sat in the bank, and modelling &ldquo;unapplied cash&rdquo; as its own
          thing would create a second record that can disagree with the first.
        </div>
      </div>
    </div>
  </div>

  <div slot="overlays">
    <div class="mj-modal" id="pe-confirm">
      <div class="mj-modal-head">
        <i class="fa-solid fa-clipboard-check" style="color:var(--mj-brand-primary)"></i>
        <div><h2>Before this captures</h2><div class="small muted" id="pe-cf-sub"></div></div>
        <span class="right"><button class="mj-iconbtn" data-close><i class="fa-solid fa-xmark"></i></button></span>
      </div>
      <div class="mj-modal-body" id="pe-cf"></div>
      <div class="mj-modal-foot">
        <span class="small muted"><i class="fa-solid fa-lock"></i> Allocations freeze at capture.</span>
        <span class="right">
          <button class="mj-btn mj-btn--flat" data-close>Back</button>
          <button class="mj-btn mj-btn--primary" data-close><i class="fa-solid fa-check"></i> Capture</button></span>
      </div>
    </div>
  </div>
</template>

<script src="../assets/data.js"></script>
<script src="../assets/shell.js"></script>
<script>
const H = MJ.H;
const r2 = n => Math.round(n * 100) / 100;

const state = {
  customerID: 'O1',
  amount: 7076.77,
  type: 'Check',
  alloc: {},           // orderNumber -> applied amount
};

function parseMoney(s) {
  const n = parseFloat(String(s).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

function totals() {
  const applied = r2(Object.values(state.alloc).reduce((s, v) => s + v, 0));
  return { applied, unallocated: r2(state.amount - applied) };
}

/* ── render ─────────────────────────────────────────────────────────────── */
function render() {
  const cust = DB.customerByID(state.customerID);
  const open = DB.openOrdersFor(state.customerID);
  const credits = DB.creditsFor(state.customerID);
  const t = totals();

  document.getElementById('pe-cust-hint').innerHTML =
    `${cust.terms} · open ${F.money(cust.open)} across ${open.length} order${open.length === 1 ? '' : 's'}` +
    (cust.credit ? ` · <b class="mj-money--credit">${F.money(cust.credit)} credit already held</b>` : '');

  /* instrument fields follow the tender's requirements, not a fixed form */
  const inst = {
    Check: `<div class="grid-2">
        <div class="mj-field"><label>Check number</label><input class="mj-input" value="40219"></div>
        <div class="mj-field"><label>Check date</label><input class="mj-input" type="date" value="2026-07-27"></div>
      </div>
      <div class="small muted">This tender requires a reference and no provider, so that is what it asks for.</div>`,
    Card: `<div class="mj-field"><label>Card</label>
        <select class="mj-select"><option>Visa ···· 4118 · exp 08/29 (default)</option>
          <option>Bank ···· 7745</option><option>New card — hosted tokenization</option></select></div>
      <div class="small muted">The wallet entry is copied onto this payment, never shared, so the snapshot cannot
        drift if the saved card changes later.</div>`,
    ACH: `<div class="mj-field"><label>Bank account</label>
        <select class="mj-select"><option>···· 7745 · Meridian Association</option></select></div>`,
    Wire: `<div class="mj-field"><label>Wire confirmation</label><input class="mj-input" placeholder="Confirmation №"></div>`,
    AccountCredit: `<div class="mj-banner mj-banner--info"><i class="fa-solid fa-piggy-bank"></i>
        <div class="body">Spending a credit writes a <b>zero-amount</b> payment with two offsetting lines — minus
        on the credit order, plus on the target. No new cash entered the business; this only re-attributes money
        already received. <a href="credit.html">Use the credit screen →</a></div></div>`,
  }[state.type];
  document.getElementById('pe-instrument').innerHTML = inst || '';

  /* allocation rows */
  document.getElementById('pe-rows').innerHTML = open.map(o => {
    const applied = state.alloc[o.number] || 0;
    const leaves = r2(o.balance - applied);
    const late = o.dueDate ? F.days(o.dueDate) : 0;
    return `<tr>
      <td><a class="mono primary" href="../orders/document.html">${o.number}</a></td>
      <td><div class="small">${o.description || ''}</div>
        ${H.origin(o.origin, o.originRef)}</td>
      <td>${o.dueDate ? F.dateShort(o.dueDate) : '—'}
        ${late > 0 ? `<div class="pe-late">${late}d late</div>` : ''}</td>
      <td>${H.company(o.companyID)}</td>
      <td class="num">${F.money(o.balance)}</td>
      <td class="num">
        <input class="mj-input is-num pe-alloc-input" value="${applied ? applied.toFixed(2) : ''}"
               placeholder="0.00" onchange="PE.set('${o.number}', this.value)">
      </td>
      <td class="num ${leaves < 0 ? 'mj-money--credit strong' : leaves === 0 ? 'mj-money--muted' : ''}">
        ${leaves === 0 ? 'settled' : F.money(leaves)}
        ${leaves < 0 ? '<div class="secondary">credit</div>' : ''}</td>
    </tr>`;
  }).join('') + (credits.length ? credits.map(o => `
    <tr style="background:var(--mj-status-success-bg)">
      <td><a class="mono" href="../orders/document.html">${o.number}</a></td>
      <td class="small">Credit already held — spend it rather than taking more cash</td>
      <td>—</td><td>${H.company(o.companyID)}</td>
      <td class="num mj-money--credit">${F.money(o.balance)}</td>
      <td class="num"><a class="small" href="credit.html">Apply →</a></td>
      <td class="num muted">—</td></tr>`).join('') : '');

  /* the unallocated readout — the centre of the screen */
  const box = document.getElementById('pe-unalloc');
  const v = document.getElementById('pe-unalloc-v');
  box.classList.toggle('is-zero', t.unallocated === 0);
  box.classList.toggle('is-over', t.unallocated < 0);
  v.textContent = F.money(t.unallocated);
  document.getElementById('pe-unalloc-note').innerHTML =
    t.unallocated === 0 ? '<b>Balanced</b> — ready to capture.'
    : t.unallocated > 0 ? `${F.money(t.unallocated)} of this payment is not yet applied to anything.`
    : `Applied ${F.money(-t.unallocated)} more than was received — reduce an allocation.`;

  const btn = document.getElementById('pe-capture');
  btn.classList.toggle('is-disabled', t.unallocated !== 0);

  /* consequences */
  const overs = open.filter(o => (state.alloc[o.number] || 0) > o.balance);
  const cross = new Set(open.filter(o => state.alloc[o.number]).map(o => o.companyID));
  const eff = [];

  if (overs.length) {
    eff.push(`<div class="mj-banner mj-banner--success"><i class="fa-solid fa-piggy-bank"></i>
      <div class="body"><strong>This creates account credit.</strong>
      ${overs.map(o => `${o.number} goes to ${F.money(r2(o.balance - state.alloc[o.number]))} —
        ${F.money(r2(state.alloc[o.number] - o.balance))} of spendable credit`).join('; ')}.
      <div class="small" style="margin-top:4px">Legitimate and common. No separate credit record is created; the
      negative balance is the credit.</div></div></div>`);
  }

  if (cross.size > 1) {
    eff.push(`<div class="mj-banner mj-banner--warning"><i class="fa-solid fa-building-columns"></i>
      <div class="body"><strong>This allocation crosses companies.</strong> Cash landed with Sidecar Learning but
      settles receivables owned by ${[...cross].map(c => DB.companies[c].short).join(' and ')}.
      <div class="small" style="margin-top:4px">Intercompany legs book <b>here, at allocation</b> — not at capture.
      A capture only says how much cash arrived; only an allocation says whose revenue it settles. Each
      counterparty gets a Due To / Due From pair, and a missing intercompany account match is a hard refusal
      rather than a guess, because a guessed account still balances.</div></div></div>`);
  }

  const settled = open.filter(o => (state.alloc[o.number] || 0) >= o.balance && o.balance > 0);
  if (settled.length) {
    eff.push(`<div class="mj-banner mj-banner--neutral"><i class="fa-solid fa-check-double"></i>
      <div class="body"><strong>${settled.length} order${settled.length === 1 ? '' : 's'} fully settled</strong> —
      ${settled.map(o => o.number).join(', ')}. Their payment status flips to Paid by trigger from these
      allocations, not by anyone typing it.</div></div>`);
  }

  document.getElementById('pe-effects').innerHTML = eff.join('');

  /* the cash-leg entry */
  const fee = state.type === 'Card' ? r2(state.amount * 0.029) : 0;
  const g = DB.glRoles.C1;
  document.getElementById('pe-je').innerHTML = `
    <table class="mj-table mj-table--compact"><tbody>
      <tr><td style="width:34px" class="muted strong">Dr</td><td>${g.Cash}</td>
        <td class="num">${F.money(r2(state.amount - fee))}</td></tr>
      ${fee ? `<tr><td class="muted strong">Dr</td><td>${g.Fee}</td>
        <td class="num">${F.money(fee)}</td></tr>` : ''}
      <tr><td class="muted strong">Cr</td><td>${g.AR}</td>
        <td class="num">${F.money(state.amount)}</td></tr>
    </tbody></table>
    <div class="small muted" style="margin-top:var(--mj-space-2)">
      A/R is credited at <b>gross</b>. Netting the processing fee against it would leave a residue on the
      customer's balance that no payment could ever clear — the fee is our cost, not their debt.
      ${fee ? '' : 'Cheques carry no processor fee, so there is no fee leg.'}
    </div>
    <div class="mock-note is-api" style="margin-bottom:0">
      The cash leg books inside the same transaction as the capture, so a payment that fails to book does not
      persist as captured. Idempotency is the journal-entry link going null→value once, not the status.
    </div>`;

  renderConfirm(t, overs, cross);
}

function renderConfirm(t, overs, cross) {
  document.getElementById('pe-cf-sub').textContent =
    `${F.money(state.amount)} from ${DB.customerByID(state.customerID).name}`;

  const open = DB.openOrdersFor(state.customerID).filter(o => state.alloc[o.number]);

  document.getElementById('pe-cf').innerHTML = `
    <div class="mj-banner ${t.unallocated === 0 ? 'mj-banner--success' : 'mj-banner--error'}">
      <i class="fa-solid ${t.unallocated === 0 ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
      <div class="body">${t.unallocated === 0
        ? `<strong>Allocations equal the amount received.</strong> ${F.money(state.amount)} across
           ${open.length} order${open.length === 1 ? '' : 's'}.`
        : `<strong>${F.money(Math.abs(t.unallocated))} ${t.unallocated > 0 ? 'unallocated' : 'over-allocated'}.</strong>
           A payment whose lines do not sum to its amount cannot capture.`}</div>
    </div>

    <details class="mj-panel" open style="margin-top:var(--mj-space-4)">
      <summary><i class="fa-solid fa-list-check"></i> Applying to
        <span class="right"><span class="mj-chip mj-chip--outline">${open.length} orders</span></span></summary>
      <div class="mj-panel-body">
        <table class="mj-table mj-table--compact"><tbody>
          ${open.map(o => `<tr><td class="mono">${o.number}</td>
            <td>${DB.companies[o.companyID].short}</td>
            <td class="num">${F.money(state.alloc[o.number])}</td>
            <td class="num ${r2(o.balance - state.alloc[o.number]) < 0 ? 'mj-money--credit' : 'muted'}">
              leaves ${F.money(r2(o.balance - state.alloc[o.number]))}</td></tr>`).join('')}
        </tbody></table>
      </div>
    </details>

    <details class="mj-panel" ${cross.size > 1 ? 'open' : ''}>
      <summary><i class="fa-solid fa-scale-balanced"></i> Journal entries
        <span class="right"><span class="mj-chip mj-chip--success">${cross.size > 1 ? (cross.size + 1) : 1} entries · balanced</span></span></summary>
      <div class="mj-panel-body small">
        <b>Cash leg</b> — Dr Operating Cash ${F.money(state.amount)} / Cr A/R ${F.money(state.amount)}.
        ${cross.size > 1 ? `<div style="margin-top:var(--mj-space-2)"><b>Intercompany legs</b> — one entry per
          (allocation × company). The collector books cash for the whole allocation, credits only its own A/R, and
          raises a Due To for each counterparty; each counterparty books Due From and credits its own A/R.</div>` : ''}
        <div class="muted" style="margin-top:var(--mj-space-2)">The processing fee, when there is one, stays on the
          payment header as its own entry — the processor takes its cut from the payment as a whole, and pro-rating
          it across allocations would invent precision the fact does not have.</div>
      </div>
    </details>

    <details class="mj-panel">
      <summary><i class="fa-solid fa-lock"></i> What freezes</summary>
      <div class="mj-panel-body small muted">After capture the header and its allocations are immutable. Corrections
        are refund or reversal payments — a captured payment whose allocations could be rewritten underneath its
        journal entries would silently desynchronise the sub-ledger from the ledger.</div>
    </details>

    <div class="mock-note is-api">Stubbed: the capture, the allocation writes and the cash-leg booking are one
      server operation. There is no client-side multi-save sequence here by design.</div>`;
}

/* ── mutations ──────────────────────────────────────────────────────────── */
const PE = {
  set(number, v) {
    const n = parseMoney(v);
    if (n <= 0) delete state.alloc[number]; else state.alloc[number] = r2(n);
    render();
  },
  auto() {
    state.alloc = {};
    let left = state.amount;
    DB.openOrdersFor(state.customerID).forEach(o => {
      if (left <= 0) return;
      const take = r2(Math.min(left, o.balance));
      state.alloc[o.number] = take;
      left = r2(left - take);
    });
    if (left > 0) {
      // Everything is settled and cash remains — park the rest on the newest
      // order, which turns it into credit rather than into unapplied cash.
      const last = DB.openOrdersFor(state.customerID).at(-1);
      if (last) state.alloc[last.number] = r2((state.alloc[last.number] || 0) + left);
    }
    render();
  },
  clear() { state.alloc = {}; render(); },
};

MJ.mount({
  nav: 'payments', rail: 'entry',
  title: 'Take a payment',
  icon: 'fa-solid fa-hand-holding-dollar',
  subtitle: 'Record the cash, then say what it settles',
  ready() {
    render();
    document.getElementById('pe-amount').addEventListener('change', e => {
      state.amount = r2(parseMoney(e.target.value));
      e.target.value = state.amount.toFixed(2);
      render();
    });
    document.getElementById('pe-type').addEventListener('change', e => {
      state.type = e.target.value; render();
    });
  },
});
</script>
</body>
</html>
