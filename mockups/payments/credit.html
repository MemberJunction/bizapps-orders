<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account credits — MJ Orders</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .cr-flow {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--mj-space-4);
    align-items: center;
  }
  .cr-side {
    border: 1px solid var(--mj-border-default); border-radius: var(--mj-radius-md);
    padding: var(--mj-space-4); background: var(--mj-bg-surface);
  }
  .cr-side.is-from { border-color: color-mix(in srgb, var(--mj-status-success) 45%, transparent); }
  .cr-side.is-to { border-color: color-mix(in srgb, var(--mj-brand-primary) 45%, transparent); }
  .cr-arrow { color: var(--mj-text-muted); font-size: 20px; }
  @media (max-width: 900px) {
    .cr-flow { grid-template-columns: 1fr; }
    .cr-arrow { transform: rotate(90deg); justify-self: center; }
  }
</style>
</head>
<body>

<template id="page">

  <div slot="meta"><span class="mj-chip mj-chip--success" id="cr-total">—</span></div>

  <div slot="actions">
    <a class="mj-btn mj-btn--outline" href="refund.html"><i class="fa-solid fa-arrow-rotate-left"></i> Refund instead</a>
    <button class="mj-btn mj-btn--primary" data-open="#cr-confirm"><i class="fa-solid fa-check"></i> Apply credit</button>
  </div>

  <div slot="body">
    <div class="mock-note">
      There is no credit-memo table and no stored-credit balance. A customer's credit <b>is</b> an order with a
      negative balance — because a second record holding the same number is a second thing that can disagree with
      it. Spending one writes a <b>zero-amount</b> payment with two offsetting lines: no new cash entered the
      business, this only re-attributes money already received.
    </div>

    <div class="mj-card" style="margin-bottom:var(--mj-space-6)">
      <div class="mj-card-head"><i class="fa-solid fa-piggy-bank"></i><h3>Credits customers are holding</h3></div>
      <table class="mj-table mj-table--compact">
        <thead><tr><th>Customer</th><th style="width:120px">Credit order</th><th>How it arose</th>
          <th style="width:56px">Co.</th><th class="num" style="width:120px">Available</th>
          <th style="width:150px"></th></tr></thead>
        <tbody id="cr-list"></tbody>
      </table>
    </div>

    <div class="sec-label">Applying Northwind Society's credit</div>

    <div class="cr-flow">
      <div class="cr-side is-from">
        <div class="row" style="margin-bottom:var(--mj-space-2)">
          <span class="mj-chip mj-chip--success">From — the credit</span>
        </div>
        <div id="cr-from"></div>
      </div>

      <i class="fa-solid fa-arrow-right cr-arrow"></i>

      <div class="cr-side is-to">
        <div class="row" style="margin-bottom:var(--mj-space-2)">
          <span class="mj-chip mj-chip--brand">To — an open order</span>
        </div>
        <div id="cr-to"></div>
      </div>
    </div>

    <div class="grid-2" style="margin-top:var(--mj-space-6)">
      <div class="mj-card">
        <div class="mj-card-head"><i class="fa-solid fa-file-invoice"></i><h3>The payment this writes</h3>
          <span class="right"><span class="mj-chip mj-chip--outline">Amount $0.00</span></span></div>
        <div class="mj-card-pad" id="cr-payment"></div>
      </div>

      <div class="mj-card">
        <div class="mj-card-head"><i class="fa-solid fa-scale-balanced"></i><h3>What books</h3></div>
        <div class="mj-card-pad" id="cr-je"></div>
      </div>
    </div>
  </div>

  <div slot="overlays">
    <div class="mj-modal" id="cr-confirm">
      <div class="mj-modal-head">
        <i class="fa-solid fa-piggy-bank" style="color:var(--mj-brand-primary)"></i>
        <div><h2>Apply this credit?</h2><div class="small muted" id="cr-cf-sub"></div></div>
        <span class="right"><button class="mj-iconbtn" data-close><i class="fa-solid fa-xmark"></i></button></span>
      </div>
      <div class="mj-modal-body" id="cr-cf"></div>
      <div class="mj-modal-foot">
        <span class="small muted"><i class="fa-solid fa-lock"></i> One transaction.</span>
        <span class="right"><button class="mj-btn mj-btn--flat" data-close>Back</button>
          <button class="mj-btn mj-btn--primary" data-close>Apply credit</button></span>
      </div>
    </div>
  </div>
</template>

<script src="../assets/data.js"></script>
<script src="../assets/shell.js"></script>
<script>
const H = MJ.H;
const r2 = n => Math.round(n * 100) / 100;

const state = { customerID: 'O2', fromOrder: 'ORD-1008', toOrder: 'ORD-1011', amount: 250.00 };

function render() {
  /* every credit across all customers */
  const all = [];
  DB.customers.forEach(c => DB.creditsFor(c.id).forEach(o => all.push({ c, o })));
  const total = r2(all.reduce((s, x) => s + Math.abs(x.o.balance), 0));
  document.getElementById('cr-total').textContent = `${F.money(total)} held by ${all.length} customers`;

  document.getElementById('cr-list').innerHTML = all.map(({ c, o }) => `
    <tr>
      <td><a href="../receivables/aging.html">${c.name}</a>
        <div class="secondary">${c.kind}</div></td>
      <td><a class="mono" href="../orders/document.html">${o.number}</a></td>
      <td class="small">${o.type === 'Return'
        ? `Return of goods — ${o.reversalReason || ''}`
        : 'Over-payment — customer paid more than the order was worth'}
        <div class="secondary">${F.date(o.orderDate)}</div></td>
      <td>${H.company(o.companyID)}</td>
      <td class="num strong mj-money--credit">${F.money(Math.abs(o.balance))}</td>
      <td>
        <button class="mj-btn mj-btn--outline mj-btn--sm" onclick="CR.pick('${c.id}','${o.number}')">Apply</button>
        <a class="mj-btn mj-btn--flat mj-btn--sm" href="refund.html">Refund</a>
      </td>
    </tr>`).join('');

  const from = DB.orderByNumber(state.fromOrder);
  const open = DB.openOrdersFor(state.customerID);
  const to = DB.orderByNumber(state.toOrder) || open[0];
  const avail = Math.abs(from.balance);
  state.amount = Math.min(state.amount, avail, to ? to.balance : 0);

  document.getElementById('cr-from').innerHTML = `
    <div class="row"><a class="mono strong" href="../orders/document.html">${from.number}</a>
      ${H.company(from.companyID)}</div>
    <div class="small muted">${from.description || ''}</div>
    <div class="mj-money-strip" style="grid-template-columns:1fr 1fr;margin-top:var(--mj-space-3)">
      <div><span class="l">Order total</span><span class="v">${F.money(from.gross)}</span></div>
      <div><span class="l">Balance</span><span class="v mj-money--credit">${F.money(from.balance)}</span></div>
    </div>
    <div class="mj-field" style="margin-top:var(--mj-space-3)"><label>Amount to spend</label>
      <input class="mj-input is-num" id="cr-amt" value="${state.amount.toFixed(2)}">
      <div class="hint">Up to ${F.money(avail)} available${to ? `, and no more than ${to.number}'s ${F.money(to.balance)} balance` : ''}.</div></div>
    <div class="small muted">After applying, this order's balance moves toward zero — the credit is consumed by
      being spent, not by a status flag.</div>`;

  document.getElementById('cr-to').innerHTML = to ? `
    <div class="mj-field"><label>Target order</label>
      <select class="mj-select" id="cr-target">
        ${open.map(o => `<option value="${o.number}" ${o.number === to.number ? 'selected' : ''}>
          ${o.number} — ${F.money(o.balance)} due ${o.dueDate ? F.dateShort(o.dueDate) : ''}</option>`).join('')}
      </select></div>
    <div class="small muted">${to.description || ''}</div>
    <div class="mj-money-strip" style="grid-template-columns:1fr 1fr;margin-top:var(--mj-space-3)">
      <div><span class="l">Balance now</span><span class="v">${F.money(to.balance)}</span></div>
      <div><span class="l">After credit</span><span class="v">${F.money(r2(to.balance - state.amount))}</span></div>
    </div>
    <div class="row wrap" style="margin-top:var(--mj-space-3);gap:6px">
      ${H.company(to.companyID)}
      ${to.companyID !== from.companyID
        ? '<span class="mj-chip mj-chip--warning"><i class="fa-solid fa-building-columns"></i> crosses companies</span>'
        : '<span class="mj-chip mj-chip--outline">same company</span>'}
    </div>` : '<div class="mj-empty"><i class="fa-regular fa-circle"></i><div class="t">No open orders</div></div>';

  document.getElementById('cr-payment').innerHTML = `
    <div class="mj-stated"><span class="muted small" style="width:130px">Tender</span>
      <span class="value">Account credit</span><span class="from">a real payment type</span></div>
    <div class="mj-stated"><span class="muted small" style="width:130px">Amount</span>
      <span class="value mj-num strong">$0.00</span><span class="from">no cash moved</span></div>
    <div class="sec-label" style="margin-top:var(--mj-space-3)">Its two lines</div>
    <table class="mj-table mj-table--compact"><tbody>
      <tr><td><a class="mono" href="#">${from.number}</a><div class="secondary">the credit order</div></td>
        <td class="num strong">+${F.money(state.amount)}</td></tr>
      <tr><td><a class="mono" href="#">${to ? to.number : '—'}</a><div class="secondary">the target order</div></td>
        <td class="num strong mj-money--neg">−${F.money(state.amount)}</td></tr>
      <tr class="is-total"><td>Sum</td><td class="num">$0.00</td></tr>
    </tbody></table>
    <div class="small muted" style="margin-top:var(--mj-space-2)">
      Zero is the truth here, not a degenerate case that needs special handling. The payment-equals-its-lines rule
      is satisfied exactly: two offsetting lines summing to the payment's zero amount.
    </div>`;

  const crossCo = to && to.companyID !== from.companyID;
  document.getElementById('cr-je').innerHTML = crossCo ? `
    <div class="mj-banner mj-banner--warning">
      <i class="fa-solid fa-building-columns"></i>
      <div class="body"><strong>This crosses companies, so intercompany legs are required — not optional.</strong>
      A single Dr A/R / Cr A/R spanning two legal entities could not be booked at all, because a resolved account
      must belong to its own company.</div>
    </div>
    <table class="mj-table mj-table--compact" style="margin-top:var(--mj-space-3)"><tbody>
      <tr><td colspan="3" class="small strong">${DB.companies[from.companyID].short}</td></tr>
      <tr><td style="width:34px" class="muted strong">Dr</td><td>2150 · Due To Affiliates</td>
        <td class="num">${F.money(state.amount)}</td></tr>
      <tr><td class="muted strong">Cr</td><td>1200 · Accounts Receivable</td>
        <td class="num">${F.money(state.amount)}</td></tr>
      <tr><td colspan="3" class="small strong">${DB.companies[to.companyID].short}</td></tr>
      <tr><td class="muted strong">Dr</td><td>1250 · Due From Affiliates</td>
        <td class="num">${F.money(state.amount)}</td></tr>
      <tr><td class="muted strong">Cr</td><td>1200 · Accounts Receivable</td>
        <td class="num">${F.money(state.amount)}</td></tr>
    </tbody></table>` : `
    <table class="mj-table mj-table--compact"><tbody>
      <tr><td colspan="3" class="small strong">${DB.companies[from.companyID].name}</td></tr>
      <tr><td style="width:34px" class="muted strong">Dr</td><td>1200 · A/R — ${to ? to.number : ''}</td>
        <td class="num">${F.money(state.amount)}</td></tr>
      <tr><td class="muted strong">Cr</td><td>1200 · A/R — ${from.number}</td>
        <td class="num">${F.money(state.amount)}</td></tr>
    </tbody></table>
    <div class="small muted" style="margin-top:var(--mj-space-2)">
      Same company on both sides, so this is a pure re-attribution inside one A/R account. No cash account is
      touched — nothing entered or left the bank.
    </div>`;

  document.getElementById('cr-cf-sub').textContent =
    `${F.money(state.amount)} from ${from.number} to ${to ? to.number : '—'}`;
  document.getElementById('cr-cf').innerHTML = `
    <div class="mj-banner mj-banner--success"><i class="fa-solid fa-circle-check"></i>
      <div class="body"><strong>No cash moves.</strong> ${from.number}'s credit drops to
      ${F.money(r2(from.balance + state.amount))} and ${to ? to.number : ''} drops to
      ${F.money(r2((to ? to.balance : 0) - state.amount))}.</div></div>
    <details class="mj-panel" open style="margin-top:var(--mj-space-4)">
      <summary><i class="fa-solid fa-file-invoice"></i> A zero-amount payment with two lines</summary>
      <div class="mj-panel-body small">+${F.money(state.amount)} on ${from.number},
        −${F.money(state.amount)} on ${to ? to.number : ''}, summing to the payment's $0.00.</div>
    </details>
    ${crossCo ? `<details class="mj-panel" open>
      <summary><i class="fa-solid fa-building-columns"></i> Intercompany legs
        <span class="right"><span class="mj-chip mj-chip--warning">required</span></span></summary>
      <div class="mj-panel-body small">Two entries, one per company, raised through the ordinary allocation path.
        A missing intercompany account match is a hard refusal rather than a guess.</div>
    </details>` : ''}
    <div class="mock-note is-api">Stubbed: one server operation writes the payment, both lines and any
      intercompany entries together.</div>`;
}

const CR = {
  pick(customerID, orderNumber) {
    state.customerID = customerID;
    state.fromOrder = orderNumber;
    const open = DB.openOrdersFor(customerID);
    state.toOrder = open.length ? open[0].number : null;
    state.amount = Math.abs(DB.orderByNumber(orderNumber).balance);
    render();
    wire();
  },
};

function wire() {
  const amt = document.getElementById('cr-amt');
  if (amt) amt.addEventListener('change', e => {
    const n = parseFloat(String(e.target.value).replace(/[^0-9.]/g, ''));
    state.amount = isNaN(n) ? 0 : r2(n);
    render(); wire();
  });
  const tgt = document.getElementById('cr-target');
  if (tgt) tgt.addEventListener('change', e => {
    state.toOrder = e.target.value; render(); wire();
  });
}

MJ.mount({
  nav: 'payments', rail: 'credit',
  title: 'Account credits',
  icon: 'fa-solid fa-piggy-bank',
  subtitle: 'A negative order balance is the credit — spend it, or refund it',
  ready() { render(); wire(); },
});
</script>
</body>
</html>
