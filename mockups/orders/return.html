<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create a return — MJ Orders</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .rt-origin {
    display: flex; align-items: center; gap: var(--mj-space-4); flex-wrap: wrap;
    padding: var(--mj-space-3) var(--mj-space-4);
    background: var(--mj-bg-surface); border: 1px solid var(--mj-border-default);
    border-radius: var(--mj-radius-md);
  }
  .rt-qty { display: flex; align-items: center; gap: var(--mj-space-2); justify-content: flex-end; }
  .rt-cap { font-size: 11px; color: var(--mj-text-muted); }
</style>
</head>
<body>

<template id="page">

  <div slot="meta"><span class="mj-chip mj-chip--warning">Return</span><span class="mj-chip">Draft</span></div>

  <div slot="actions">
    <button class="mj-btn mj-btn--outline">Save draft</button>
    <button class="mj-btn mj-btn--primary" data-open="#rt-confirm"><i class="fa-solid fa-check"></i> Confirm return</button>
  </div>

  <div slot="body">

    <div class="mock-note">
      A return is a new order that <b>mirrors</b> the original — same accounts, debit and credit swapped, positive
      amounts. It is never an edit of the booked order, because that order genuinely happened and rewriting it would
      destroy the trail of money that moved.
    </div>

    <!-- origin picker -->
    <div class="rt-origin" style="margin-bottom:var(--mj-space-4)">
      <div>
        <div class="sec-label" style="margin:0 0 3px">Returning against</div>
        <div class="row">
          <span class="mono strong" style="font-size:15px">ORD-1001</span>
          <span class="mj-chip mj-chip--success">Posted</span>
          <span class="mj-chip mj-chip--outline">BCM</span>
        </div>
      </div>
      <div style="border-left:1px solid var(--mj-border-default);padding-left:var(--mj-space-4)">
        <div class="sec-label" style="margin:0 0 3px">Customer</div>
        <div>Marcus Webb</div>
      </div>
      <div style="border-left:1px solid var(--mj-border-default);padding-left:var(--mj-space-4)">
        <div class="sec-label" style="margin:0 0 3px">Original</div>
        <div class="mj-num">$170.00 <span class="muted small">on Jul 6, 2026</span></div>
      </div>
      <div class="spacer row">
        <button class="mj-btn mj-btn--outline mj-btn--sm"><i class="fa-solid fa-magnifying-glass"></i> Change origin order</button>
        <a class="mj-btn mj-btn--flat mj-btn--sm" href="document.html">View original ↗</a>
      </div>
    </div>

    <div class="mj-split">
      <div class="right" style="order:1">
        <div class="mj-card">
          <div class="mj-card-head">
            <i class="fa-solid fa-rotate-left"></i><h3>What is coming back</h3>
            <span class="right small muted">Quantity is capped by what is still returnable</span>
          </div>
          <table class="mj-table mj-table--compact">
            <thead>
              <tr><th style="width:30px">#</th><th>Product</th>
                <th class="num" style="width:110px">Bought</th>
                <th class="num" style="width:110px">Already back</th>
                <th class="num" style="width:150px">Returning</th>
                <th class="num" style="width:110px">Unit</th>
                <th class="num" style="width:110px">Credit</th></tr>
            </thead>
            <tbody id="rt-lines"></tbody>
            <tfoot id="rt-foot"></tfoot>
          </table>
        </div>

        <div class="mj-card" style="margin-top:var(--mj-space-4)">
          <div class="mj-card-head"><i class="fa-solid fa-comment-dots"></i><h3>Why</h3></div>
          <div class="mj-card-pad">
            <div class="grid-2">
              <div class="mj-field"><label>Reason</label>
                <select class="mj-select">
                  <option selected>Damaged in transit</option><option>Wrong item shipped</option>
                  <option>Customer changed mind</option><option>Duplicate order</option>
                  <option>Pricing error</option></select></div>
              <div class="mj-field"><label>Return date</label>
                <input class="mj-input" type="date" value="2026-07-24">
                <div class="hint">The mirrored entries bear this date.</div></div>
            </div>
            <div class="mj-field"><label>Note for the record</label>
              <textarea class="mj-input" rows="2">One unit arrived water-damaged; customer kept the other.</textarea></div>
          </div>
        </div>

        <div class="mj-card" style="margin-top:var(--mj-space-4)">
          <div class="mj-card-head"><i class="fa-solid fa-money-bill-transfer"></i><h3>How to settle it</h3></div>
          <div class="mj-card-pad">
            <div class="mj-segmented" data-on-select="rtSettle" style="margin-bottom:var(--mj-space-3)">
              <button class="is-active" data-value="credit">Leave as credit</button>
              <button data-value="refund">Refund the payment</button>
            </div>
            <div id="rt-settle"></div>
          </div>
        </div>
      </div>

      <!-- consequence rail -->
      <aside class="left" style="order:2">
        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-calculator"></i><h3>What this credits</h3></div>
          <div class="mj-card-pad"><div class="mj-ladder" id="rt-ladder"></div></div>
        </div>

        <div class="mj-card" style="margin-top:var(--mj-space-4)">
          <div class="mj-card-head"><i class="fa-solid fa-scale-balanced"></i><h3>Mirrored entry</h3></div>
          <div class="mj-card-pad" id="rt-je"></div>
        </div>

        <div class="mock-note">
          Three things are settled from the <b>origin line</b>, not from today's price table: how much is still
          returnable, what it cost, and which product. Each of them produces a <i>balanced</i> entry when it goes
          wrong — so nothing downstream could ever catch it. A return priced at today's rate refunds last year's
          purchase at the wrong number and the ledger would agree.
        </div>
      </aside>
    </div>
  </div>

  <div slot="overlays">
    <div class="mj-modal" id="rt-confirm">
      <div class="mj-modal-head">
        <i class="fa-solid fa-clipboard-check" style="color:var(--mj-brand-primary)"></i>
        <div><h2>Before this return books</h2><div class="small muted">A new order, mirroring ORD-1001</div></div>
        <span class="right"><button class="mj-iconbtn" data-close><i class="fa-solid fa-xmark"></i></button></span>
      </div>
      <div class="mj-modal-body" id="rt-pf"></div>
      <div class="mj-modal-foot">
        <span class="small muted"><i class="fa-solid fa-lock"></i> One transaction.</span>
        <span class="right">
          <button class="mj-btn mj-btn--flat" data-close>Back</button>
          <button class="mj-btn mj-btn--primary" data-close><i class="fa-solid fa-check"></i> Confirm return</button></span>
      </div>
    </div>
  </div>
</template>

<script src="../assets/data.js"></script>
<script src="../assets/shell.js"></script>
<script>
const ORIGIN = DB.orderByNumber('ORD-1001');
let SETTLE = 'credit';

/* Returnable quantity counts prior reversals across ALL orders, plus in-memory
   siblings on this one. Over-returning is refused outright. */
const state = {
  lines: ORIGIN.lines.map(l => ({
    n: l.n, productID: l.productID, unitPrice: l.unitPrice, discPct: l.discPct,
    bought: l.qty, priorReturns: 0, returning: 1,
    taxRate: l.taxLayers.length ? l.taxLayers[0].rate : 0,
    taxName: l.taxLayers.length ? l.taxLayers[0].name : null,
    companyID: l.companyID,
  })),
};

const r2 = n => Math.round(n * 100) / 100;

function calc() {
  const lines = state.lines.map(l => {
    const remaining = l.bought - l.priorReturns;
    const qty = Math.min(Math.max(0, l.returning), remaining);
    const net = r2(-qty * l.unitPrice * (1 - l.discPct));
    const tax = r2(net * l.taxRate);
    return { ...l, remaining, qty, net, tax, gross: r2(net + tax) };
  });
  const net = r2(lines.reduce((s, l) => s + l.net, 0));
  const tax = r2(lines.reduce((s, l) => s + l.tax, 0));
  return { lines, net, tax, gross: r2(net + tax) };
}

function render() {
  const c = calc();

  document.getElementById('rt-lines').innerHTML = c.lines.map(l => {
    const p = DB.products[l.productID];
    const atCap = l.qty >= l.remaining;
    return `<tr>
      <td class="muted">${l.n}</td>
      <td><span class="primary">${p.name}</span><div class="secondary">${p.sku}</div></td>
      <td class="num">${F.qty(l.bought)}</td>
      <td class="num ${l.priorReturns ? '' : 'muted'}">${l.priorReturns ? F.qty(l.priorReturns) : '—'}</td>
      <td>
        <div class="rt-qty">
          <div class="mj-stepper-num">
            <button onclick="RT.bump(${l.n},-1)">−</button>
            <input value="${F.qty(l.qty)}" onchange="RT.set(${l.n}, this.value)">
            <button onclick="RT.bump(${l.n},1)" ${atCap ? 'disabled title="Nothing more is returnable"' : ''}>+</button>
          </div>
        </div>
        <div class="rt-cap" style="text-align:right">
          ${atCap ? '<span style="color:var(--mj-status-warning-text)">at the cap</span>' : `max ${F.qty(l.remaining)}`}
        </div>
      </td>
      <td class="num">${F.money(l.unitPrice)}
        <div class="secondary">from the origin line</div></td>
      <td class="num strong ${l.gross ? 'mj-money--credit' : 'muted'}">${l.gross ? F.money(l.gross) : '—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('rt-foot').innerHTML = `<tr class="is-total">
    <td colspan="6">Credit total</td>
    <td class="num mj-money--credit">${F.money(c.gross)}</td></tr>`;

  document.getElementById('rt-ladder').innerHTML = `
    <div class="mj-ladder-row"><span class="label">Goods returned</span>
      <span class="amt">${F.money(c.net)}</span></div>
    <div class="mj-ladder-row"><span class="label">Tax given back
      ${MJ.H.why('why-rt-tax', `Tax reverses with the goods — the same layers that were charged, at the same rates,
        on the negative base. A return that kept the tax would quietly overstate the tax liability forever.`)}</span>
      <span class="amt">${F.money(c.tax)}</span></div>
    <div class="mj-ladder-row is-total"><span class="label">Credit</span>
      <span class="amt mj-money--credit">${F.money(c.gross)}</span></div>
    <div class="mj-ladder-note"><i class="fa-solid fa-circle-info"></i>
      <span>Pricing is skipped entirely for a negative quantity — there is no volume band for −1, and asking would
      produce a message about quantity instead of one about the return.</span></div>`;

  const g = DB.glRoles[c.lines[0].companyID];
  document.getElementById('rt-je').innerHTML = `
    <div class="small muted" style="margin-bottom:var(--mj-space-2)">
      ${DB.companies[c.lines[0].companyID].short} · line 1</div>
    <table class="mj-table mj-table--compact"><tbody>
      <tr><td style="width:34px" class="muted strong">Dr</td><td>${g.Sales}</td>
        <td class="num">${F.money(Math.abs(c.net))}</td></tr>
      <tr><td class="muted strong">Dr</td><td>${g.Tax || '2250 · Sales Tax Payable'}</td>
        <td class="num">${F.money(Math.abs(c.tax))}</td></tr>
      <tr><td class="muted strong">Cr</td><td>${g.AR}</td>
        <td class="num">${F.money(Math.abs(c.gross))}</td></tr>
    </tbody></table>
    <div class="mj-banner mj-banner--success" style="margin-top:var(--mj-space-2)">
      <i class="fa-solid fa-check"></i>
      <div class="body">Same accounts as the original, <b>sides swapped, amounts positive</b>. A ledger line with a
      negative debit is not a thing — so a reversal mirrors rather than negating.</div></div>`;

  document.getElementById('rt-settle').innerHTML = SETTLE === 'credit' ? `
    <div class="mj-banner mj-banner--neutral">
      <i class="fa-solid fa-piggy-bank"></i>
      <div class="body">The return posts a <b>${F.money(Math.abs(c.gross))}</b> credit and stops there.
      Marcus Webb's balance drops by that amount and the credit is spendable on his next order.
      <div class="small muted" style="margin-top:4px">Nothing leaves the bank, so no cash entry is written.</div></div>
    </div>` : `
    <div class="stack-3">
      <div class="mj-banner mj-banner--info">
        <i class="fa-solid fa-arrow-rotate-left"></i>
        <div class="body">A refund is a <b>new payment</b>, not an edit of the original capture. It reverses
        <b>${F.money(Math.abs(c.gross))}</b> against PAY-2990 and un-applies proportionally to how that payment was
        originally applied.</div>
      </div>
      <div class="mj-stated"><span class="muted small" style="width:150px">Original payment</span>
        <span class="value mono">PAY-2990 · Visa ···· 1881</span><span class="from">Jul 8, 2026</span></div>
      <div class="mj-stated"><span class="muted small" style="width:150px">Refundable remaining</span>
        <span class="value">$170.00</span><span class="from">no prior refunds</span></div>
      <div class="mj-stated"><span class="muted small" style="width:150px">Processing fee</span>
        <span class="value">Not reversed</span><span class="from">the processor kept it</span></div>
      <a class="mj-btn mj-btn--outline mj-btn--sm" href="../payments/refund.html">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Do it on the refund screen instead</a>
    </div>`;

  renderPreflight(c);
}

function renderPreflight(c) {
  document.getElementById('rt-pf').innerHTML = `
    <div class="mj-banner mj-banner--success">
      <i class="fa-solid fa-circle-check"></i>
      <div class="body"><strong>Nothing is blocking this return.</strong> Quantities are within what remains
      returnable and every account resolved.</div>
    </div>

    <details class="mj-panel" open style="margin-top:var(--mj-space-4)">
      <summary><i class="fa-solid fa-scale-balanced"></i> Journal entries
        <span class="right"><span class="mj-chip mj-chip--success">1 entry · mirrored · balanced</span></span></summary>
      <div class="mj-panel-body small">
        BC Media, line 1: Dr Publication Revenue ${F.money(Math.abs(c.net))} · Dr Sales Tax Payable
        ${F.money(Math.abs(c.tax))} · Cr Accounts Receivable ${F.money(Math.abs(c.gross))}.
        <div class="muted" style="margin-top:6px">Landing Pending, like any other entry orders creates.</div>
      </div>
    </details>

    <details class="mj-panel" open>
      <summary><i class="fa-solid fa-shield-halved"></i> Guards that were checked
        <span class="right"><span class="mj-chip mj-chip--outline">3 of 3 passed</span></span></summary>
      <div class="mj-panel-body small">
        <div class="stack-2">
          <div class="row-t"><i class="fa-solid fa-check" style="color:var(--mj-status-success);margin-top:3px"></i>
            <div><b>Returnable quantity</b> — 1 of 2 units, no prior returns anywhere against this line.</div></div>
          <div class="row-t"><i class="fa-solid fa-check" style="color:var(--mj-status-success);margin-top:3px"></i>
            <div><b>Price inherited</b> — $80.00 from the origin line, not from today's tiered price list
            (which would now quote $80.00 anyway, but only by luck).</div></div>
          <div class="row-t"><i class="fa-solid fa-check" style="color:var(--mj-status-success);margin-top:3px"></i>
            <div><b>Product matches</b> — the origin is the sole authority on which product is coming back.</div></div>
        </div>
      </div>
    </details>

    <details class="mj-panel">
      <summary><i class="fa-solid fa-dolly"></i> Fulfillment</summary>
      <div class="mj-panel-body small muted">The returned unit's line flips to <b>Returned</b>. No entry fires —
        goods movement is logistics.</div>
    </details>

    <div class="mock-note is-api">
      <code>Orders.ConfirmOrder</code> with <code>OrderType: 'Return'</code> and
      <code>ReversesOrderHeaderID</code> set. The reversal resolver supplies price, cap and product from the
      origin. Stubbed here.
    </div>`;
}

const RT = {
  bump(n, d) {
    const l = state.lines.find(x => x.n === n);
    l.returning = Math.max(0, Math.min(l.returning + d, l.bought - l.priorReturns));
    render();
  },
  set(n, v) {
    const l = state.lines.find(x => x.n === n);
    const q = parseFloat(v);
    l.returning = isNaN(q) ? 0 : Math.max(0, Math.min(q, l.bought - l.priorReturns));
    render();
  },
};

function rtSettle(v) { SETTLE = v; render(); }

MJ.mount({
  nav: 'orders', rail: 'returns',
  title: 'Create a return',
  icon: 'fa-solid fa-rotate-left',
  subtitle: 'A new order that mirrors the original — never an edit of it',
  ready: render,
});
</script>
</body>
</html>
