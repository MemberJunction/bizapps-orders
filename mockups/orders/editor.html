<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order editor — MJ Orders</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* Persistent chrome above the tabs — identity, stage, money. Always visible. */
  .ed-identity {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0; border: 1px solid var(--mj-border-default); border-radius: var(--mj-radius-md);
    background: var(--mj-bg-surface); overflow: hidden; margin-bottom: var(--mj-space-3);
  }
  .ed-identity > div { padding: var(--mj-space-3) var(--mj-space-4); border-right: 1px solid var(--mj-border-subtle); }
  .ed-identity > div:last-child { border-right: none; }
  .ed-identity .l { font-size: 10px; font-weight: var(--mj-font-bold); letter-spacing: .06em;
    text-transform: uppercase; color: var(--mj-text-muted); display: block; margin-bottom: 3px; }
  .ed-identity .v { font-size: 13px; font-weight: var(--mj-font-medium); }

  .ed-sticky {
    position: sticky; top: calc(-1 * var(--mj-space-6)); z-index: var(--mj-z-sticky);
    background: var(--mj-bg-page); padding-top: var(--mj-space-6);
    margin: calc(-1 * var(--mj-space-6)) calc(-1 * var(--mj-space-6)) 0;
    padding-left: var(--mj-space-6); padding-right: var(--mj-space-6);
  }
  .ed-tabs-row { display: flex; align-items: flex-end; gap: var(--mj-space-3); margin-top: var(--mj-space-4); }

  /* Line table: five numbers, everything else in the drawer */
  .ed-line-nm { display: flex; align-items: baseline; gap: var(--mj-space-2); }
  .ed-line-conseq { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .ed-addline {
    display: flex; align-items: center; gap: var(--mj-space-2);
    padding: var(--mj-space-3); color: var(--mj-brand-primary);
    font-size: 12.5px; font-weight: var(--mj-font-medium); cursor: pointer;
    border-top: 1px dashed var(--mj-border-default);
  }
  .ed-addline:hover { background: var(--mj-bg-surface-hover); }

  /* The taxable-base ladder — proves layers share one base */
  .ed-base {
    display: grid; grid-template-columns: 1fr auto; gap: 4px var(--mj-space-4);
    font-size: 12.5px; padding: var(--mj-space-3) var(--mj-space-4);
    background: var(--mj-bg-surface-sunken); border-radius: var(--mj-radius-md);
  }
  .ed-base .amt { font-variant-numeric: tabular-nums; text-align: right; }
  .ed-base .tot { border-top: 1px solid var(--mj-border-strong); padding-top: 5px; margin-top: 3px; font-weight: var(--mj-font-semibold); }

  .ed-je { border: 1px solid var(--mj-border-default); border-radius: var(--mj-radius-md); overflow: hidden; }
  .ed-je + .ed-je { margin-top: var(--mj-space-3); }
  .ed-je-head {
    display: flex; align-items: center; gap: var(--mj-space-2);
    padding: var(--mj-space-2) var(--mj-space-3); background: var(--mj-bg-surface-card);
    border-bottom: 1px solid var(--mj-border-default); font-size: 12.5px;
  }
  .ed-je table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .ed-je td { padding: 6px var(--mj-space-3); border-bottom: 1px solid var(--mj-border-subtle); }
  .ed-je tr:last-child td { border-bottom: none; }
  .ed-je td.side { width: 34px; font-weight: var(--mj-font-bold); color: var(--mj-text-muted); font-size: 11px; }
  .ed-je td.amt { text-align: right; font-variant-numeric: tabular-nums; width: 120px; }
  .ed-je tr.foot td { background: var(--mj-bg-surface-card); font-weight: var(--mj-font-semibold); }
</style>
</head>
<body>

<template id="page">

  <div slot="meta" id="ed-meta"></div>

  <div slot="actions">
    <button class="mj-btn mj-btn--outline" data-open="#doc-preview"><i class="fa-regular fa-file-lines"></i> Preview bill</button>
    <button class="mj-btn mj-btn--danger" data-open="#void"><i class="fa-solid fa-ban"></i> Void</button>
    <button class="mj-btn mj-btn--outline"><i class="fa-regular fa-floppy-disk"></i> Save draft</button>
    <button class="mj-btn mj-btn--primary" data-open="#preflight"><i class="fa-solid fa-check"></i> Confirm order</button>
  </div>

  <div slot="body">

    <!-- ══ persistent chrome ══ -->
    <div class="ed-sticky">
      <div class="ed-identity" id="ed-identity"></div>

      <div class="row wrap" style="gap:var(--mj-space-4)">
        <div class="mj-stepper" id="ed-stepper"></div>
        <span class="small muted spacer" id="ed-stage-note"></span>
      </div>

      <div class="mj-money-strip" style="margin-top:var(--mj-space-3)" id="ed-money"></div>

      <div class="ed-tabs-row">
        <div class="mj-tabs" data-tabs="ed">
          <button class="mj-tab is-active" data-tab="lines">Lines <span class="n" id="tabn-lines">2</span></button>
          <button class="mj-tab" data-tab="parties">Parties</button>
          <button class="mj-tab" data-tab="charges">Charges &amp; tax <span class="n" id="tabn-charges">4</span></button>
          <button class="mj-tab" data-tab="payment">Payment</button>
          <button class="mj-tab" data-tab="accounting">Accounting</button>
          <button class="mj-tab" data-tab="history">History</button>
        </div>
      </div>
    </div>

    <!-- ══ LINES ══ -->
    <div class="mj-tabpane is-active" data-pane="lines" data-pane-group="ed">
      <div class="mock-note">
        Five numbers on the row; the other thirteen fields live in the drawer. Order lines carry ship-to parties,
        service periods, subscription targets, dimensions and reversal origins — eighteen inline inputs would be a
        spreadsheet without a spreadsheet's affordances. Click any row.
      </div>

      <div class="mj-table-wrap">
        <table class="mj-table mj-table--lines">
          <thead>
            <tr>
              <th style="width:30px">#</th>
              <th>Product</th>
              <th style="width:64px">Co.</th>
              <th class="num" style="width:80px">Qty</th>
              <th class="num" style="width:150px">Unit price</th>
              <th class="num" style="width:110px">Discount</th>
              <th class="num" style="width:120px">Line net</th>
              <th class="num" style="width:110px">Tax</th>
              <th class="num" style="width:120px">Line total</th>
              <th style="width:36px"></th>
            </tr>
          </thead>
          <tbody id="ed-lines" data-on-row="edOpenLine" data-single-select></tbody>
          <tfoot></tfoot>
        </table>
        <div class="ed-addline"><i class="fa-solid fa-plus"></i> Add line <kbd style="margin-left:6px">⌥N</kbd></div>
      </div>

      <div class="grid-2" style="margin-top:var(--mj-space-4)">
        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-percent"></i><h3>Promotions on this order</h3>
            <span class="right"><span class="mj-chip mj-chip--outline">Stacking: Sequential</span></span></div>
          <div class="mj-card-pad" id="ed-promos"></div>
        </div>
        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-calculator"></i><h3>Totals</h3></div>
          <div class="mj-card-pad"><div class="mj-ladder" id="ed-ladder"></div></div>
        </div>
      </div>
    </div>

    <!-- ══ PARTIES ══ -->
    <div class="mj-tabpane" data-pane="parties" data-pane-group="ed">
      <div class="mock-note">
        A party is a person, an organization, or both — which is why the fields say <b>bill-to</b> and
        <b>ship-to</b> rather than &ldquo;customer&rdquo;. Bill-to is header-only: one order, one payer, one bill.
        Ship-to defaults here and each line may override <i>each side independently</i>.
      </div>

      <div class="grid-2">
        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-file-invoice-dollar"></i><h3>Bill to — who pays</h3>
            <span class="right"><span class="mj-chip mj-chip--outline">header only</span></span></div>
          <div class="mj-card-pad" id="ed-billto"></div>
        </div>
        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-truck-fast"></i><h3>Ship to — who receives</h3>
            <span class="right"><span class="mj-chip mj-chip--outline">line default</span></span></div>
          <div class="mj-card-pad" id="ed-shipto"></div>
        </div>
      </div>

      <div class="mj-card" style="margin-top:var(--mj-space-4)">
        <div class="mj-card-head"><i class="fa-solid fa-arrows-split-up-and-left"></i><h3>Line-level overrides</h3></div>
        <div class="mj-card-pad" id="ed-lineparties"></div>
      </div>

      <details class="mj-panel" style="margin-top:var(--mj-space-4)">
        <summary><i class="fa-solid fa-user-group"></i> Who benefits, when it isn't the payer</summary>
        <div class="mj-panel-body small">
          For a physical product, ship-to routes delivery. For an intangible — a membership, an event seat — there
          is nothing to ship, so the same fields answer <b>who the line is for</b>. That is deliberate reuse rather
          than a parallel &ldquo;beneficiary&rdquo; set: it is one question whose answer happens to be an address
          when the thing is physical.
          <div class="mj-banner mj-banner--info" style="margin-top:var(--mj-space-3)">
            <i class="fa-solid fa-circle-info"></i>
            <div class="body">Line 1's subscription accrues to <b>Jane Chen</b> as a named individual, while
            <b>Meridian Association</b> holds it. That distinction sets the duplicate scope: a second purchase for
            Jane extends her seat; a purchase for a different employee creates a second one rather than colliding.</div>
          </div>
        </div>
      </details>
    </div>

    <!-- ══ CHARGES & TAX ══ -->
    <div class="mj-tabpane" data-pane="charges" data-pane-group="ed">
      <div class="mock-note">
        Shipping, handling <b>and tax are all charges</b>. Modelling tax this way means state + county + city is
        three rows rather than a special case, so ordering, allocation, override and GL treatment are written once.
        Each charge type's <i>basis</i> decides what it computes on — which is how tax-on-shipping works, and why
        it is configuration rather than code.
      </div>

      <div class="mj-table-wrap">
        <table class="mj-table mj-table--compact">
          <thead>
            <tr>
              <th style="width:52px" class="num">Seq</th>
              <th>Charge</th>
              <th>Basis</th>
              <th class="num" style="width:120px">Basis amount</th>
              <th class="num" style="width:90px">Rate</th>
              <th class="num" style="width:110px">Amount</th>
              <th style="width:74px">Line</th>
              <th style="width:120px"></th>
            </tr>
          </thead>
          <tbody id="ed-charges"></tbody>
        </table>
      </div>

      <div class="grid-2" style="margin-top:var(--mj-space-4)">
        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-layer-group"></i><h3>How the taxable base was built</h3></div>
          <div class="mj-card-pad">
            <div class="ed-base" id="ed-basebox"></div>
            <div class="mj-banner mj-banner--success" style="margin-top:var(--mj-space-3)">
              <i class="fa-solid fa-circle-check"></i>
              <div class="body"><strong>Tax layers never compound.</strong> All three jurisdictions compute on the
              same $385.00. A non-tax charge enlarges the taxable base; a tax charge does not — so county tax is
              not charged on state tax.</div>
            </div>
          </div>
        </div>
        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-scale-unbalanced"></i><h3>Why each line taxed the way it did</h3></div>
          <div class="mj-card-pad" id="ed-taxwhy"></div>
        </div>
      </div>

      <details class="mj-panel" style="margin-top:var(--mj-space-4)">
        <summary><i class="fa-solid fa-map-location-dot"></i> Nexus and exemption both had to hold
          <span class="right"><span class="mj-chip mj-chip--success">both satisfied</span></span></summary>
        <div class="mj-panel-body">
          <div class="grid-2">
            <div>
              <div class="sec-label">Nexus — about the seller</div>
              <div class="small">BC Media is registered in <b>California</b> since Jun 2024, so it must collect
              there. Nexus lives in accounting: it is a fact about our own legal entity.</div>
            </div>
            <div>
              <div class="sec-label">Exemption — about the buyer</div>
              <div class="small">Meridian Association holds no California exemption for tangible goods, so tax
              applies. Exemption lives in orders: customer concerns start here.</div>
            </div>
          </div>
          <div class="mock-note is-api">Rates resolve from the ship-to address through accounting's hierarchical
            jurisdictions. Address → jurisdiction is a documented seam: postal matching is not rooftop-accurate,
            which is exactly where a commercial provider earns its money.</div>
        </div>
      </details>
    </div>

    <!-- ══ PAYMENT ══ -->
    <div class="mj-tabpane" data-pane="payment" data-pane-group="ed">
      <div class="mock-note">
        What's recorded here is <b>intent</b>, not a payment. On confirm it generates a real PaymentHeader and
        PaymentLine in the same transaction as the booking; from then on the payment record is the truth and these
        fields are never updated again.
      </div>

      <div class="grid-2">
        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-credit-card"></i><h3>Initial payment — intent</h3>
            <span class="right"><span class="mj-chip mj-chip--info">not yet a payment</span></span></div>
          <div class="mj-card-pad" id="ed-intent"></div>
        </div>

        <div class="mj-card">
          <div class="mj-card-head"><i class="fa-solid fa-list-check"></i><h3>Payments applied</h3></div>
          <div class="mj-card-pad">
            <div class="mj-empty" style="padding:var(--mj-space-8)">
              <i class="fa-regular fa-circle"></i>
              <div class="t">No payments yet</div>
              <div class="small">The intent on the left becomes the first one when this order confirms.</div>
              <a class="mj-btn mj-btn--outline mj-btn--sm" href="../payments/entry.html" style="margin-top:var(--mj-space-2)">
                <i class="fa-solid fa-hand-holding-dollar"></i> Take a payment instead</a>
            </div>
          </div>
        </div>
      </div>

      <div class="mj-card" style="margin-top:var(--mj-space-4)">
        <div class="mj-card-head"><i class="fa-solid fa-calendar-day"></i><h3>Terms</h3></div>
        <div class="mj-card-pad">
          <div class="grid-3">
            <div class="mj-field"><label>Payment terms</label>
              <select class="mj-select"><option selected>Net 30</option><option>Net 45</option><option>Due on receipt</option></select>
              <div class="hint">From Meridian Association's default terms.</div></div>
            <div class="mj-field"><label>Due date</label>
              <input class="mj-input" type="date" value="2026-08-28">
              <div class="hint">Order date + 30 days.</div></div>
            <div class="mj-field"><label>External document №</label>
              <input class="mj-input" value="MER-PO-4471">
              <div class="hint">Their PO. Kept separate from our order number.</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ ACCOUNTING ══ -->
    <div class="mj-tabpane" data-pane="accounting" data-pane-group="ed">
      <div class="mock-note">
        Read-only, and never duplicated. Orders creates <b>Pending</b> entries and owns nothing in the ledger, so
        every account and entry here links out to Accounting rather than being editable in place.
      </div>

      <div class="row wrap" style="margin-bottom:var(--mj-space-4);gap:var(--mj-space-2)">
        <span class="mj-chip mj-chip--success"><i class="fa-solid fa-check"></i> 2 entries · 2 companies · all balanced</span>
        <span class="mj-chip mj-chip--outline">one entry per line, always</span>
        <span class="mj-chip mj-chip--info">will land Pending</span>
        <a class="mj-btn mj-btn--outline mj-btn--sm spacer" href="#">Open in Accounting <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
      </div>

      <div id="ed-jes"></div>

      <div class="mock-note">
        Line 2's entry carries the discount through the <b>contra-account pattern</b>: revenue is credited at full
        list ($400.00) and the $40.00 promotion is debited to Sales Discounts, so discount reporting has something
        to read. Netting it into the revenue credit would balance just as well and lose the fact.
      </div>

      <div class="mj-card" style="margin-top:var(--mj-space-4)">
        <div class="mj-card-head"><i class="fa-solid fa-chart-line"></i><h3>Revenue recognition — line 1</h3>
          <span class="right"><span class="mj-chip mj-chip--warning">deferred · 12 periods</span></span></div>
        <div class="mj-card-pad">
          <div class="small muted" style="margin-bottom:var(--mj-space-3)">
            Twelve real forward-dated entries are written at booking — not a schedule that a job later materializes.
            Each releases $100.00 from deferred revenue on the monthly anniversary of the term.
          </div>
          <div id="ed-waterfall"></div>
        </div>
      </div>

      <div class="mj-card" style="margin-top:var(--mj-space-4)">
        <div class="mj-card-head"><i class="fa-solid fa-tags"></i><h3>Dimension tags</h3></div>
        <div class="mj-card-pad small" id="ed-dims"></div>
      </div>
    </div>

    <!-- ══ HISTORY ══ -->
    <div class="mj-tabpane" data-pane="history" data-pane-group="ed">
      <div class="mj-card">
        <div class="mj-card-head"><i class="fa-solid fa-clock-rotate-left"></i><h3>Record changes</h3></div>
        <div class="mj-card-pad">
          <table class="mj-table mj-table--compact">
            <thead><tr><th style="width:150px">When</th><th style="width:140px">Who</th><th>What</th></tr></thead>
            <tbody>
              <tr><td>Jul 29, 2026 · 10:42</td><td>Alicia Fontaine</td>
                  <td>Line 2 quantity 3 → <b>5</b> · price re-resolved, still band 1–9</td></tr>
              <tr><td>Jul 29, 2026 · 10:41</td><td>Alicia Fontaine</td>
                  <td>Promotion <span class="mono">SPRING10</span> applied · −$40.00</td></tr>
              <tr><td>Jul 29, 2026 · 10:39</td><td>Alicia Fontaine</td>
                  <td>Escalated from fast entry · 2 lines carried over</td></tr>
              <tr><td>Jul 29, 2026 · 10:38</td><td>Alicia Fontaine</td>
                  <td>Draft created · bill-to Meridian Association</td></tr>
            </tbody>
          </table>
          <div class="mock-note">Free from the framework — MJ tracks record changes on every entity. The editor
            just surfaces them where the order lives instead of making someone go find an audit screen.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════ OVERLAYS ══════════════ -->
  <div slot="overlays">

    <!-- line detail drawer -->
    <aside class="mj-slide-in" id="line-drawer">
      <div class="mj-slide-in-head">
        <div>
          <h2 id="ld-title">Line</h2>
          <div class="small muted" id="ld-sub"></div>
        </div>
        <span class="right">
          <button class="mj-iconbtn" title="Open the full line record"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
          <button class="mj-iconbtn" data-close><i class="fa-solid fa-xmark"></i></button>
        </span>
      </div>
      <div class="mj-slide-in-body" id="ld-body"></div>
      <div class="mj-slide-in-foot">
        <button class="mj-btn mj-btn--primary mj-btn--sm" data-close>Done</button>
        <button class="mj-btn mj-btn--flat mj-btn--sm" data-close>Cancel</button>
        <span class="small muted spacer">Every field here defaults from something. Nothing is required.</span>
      </div>
    </aside>

    <!-- charge override -->
    <div class="mj-modal" id="override">
      <div class="mj-modal-head">
        <i class="fa-solid fa-pen" style="color:var(--mj-status-warning)"></i>
        <div><h2>Override a computed charge</h2>
          <div class="small muted">Charges are computed, never hand-typed — but they are overridable on the record.</div></div>
        <span class="right"><button class="mj-iconbtn" data-close><i class="fa-solid fa-xmark"></i></button></span>
      </div>
      <div class="mj-modal-body">
        <div class="grid-2">
          <div class="mj-field"><label>Computed amount</label>
            <input class="mj-input is-num" value="25.00" disabled>
            <div class="hint">Kept on the record so the difference stays answerable.</div></div>
          <div class="mj-field"><label>Override to</label>
            <input class="mj-input is-num" value="0.00" autofocus></div>
        </div>
        <div class="mj-field"><label>Reason — required</label>
          <textarea class="mj-input" rows="3" placeholder="Why is this different from what the engine computed?">Free shipping honoured — promised on the renewal call.</textarea>
          <div class="hint">Stored with who, when, and the value it replaced. A silent override is indistinguishable from a bug.</div></div>
        <div class="mj-banner mj-banner--warning">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <div class="body">Dropping shipping to $0.00 shrinks the taxable base from $385.00 to $360.00, so all
          three tax layers recompute: total tax $36.57 → <b>$34.20</b>.</div>
        </div>
      </div>
      <div class="mj-modal-foot">
        <span class="right">
          <button class="mj-btn mj-btn--flat" data-close>Cancel</button>
          <button class="mj-btn mj-btn--primary" data-close>Override &amp; recompute</button>
        </span>
      </div>
    </div>

    <!-- void -->
    <div class="mj-modal" id="void">
      <div class="mj-modal-head">
        <i class="fa-solid fa-ban" style="color:var(--mj-status-error)"></i>
        <div><h2>Void this order?</h2><div class="small muted">ORD-1016 · Draft</div></div>
        <span class="right"><button class="mj-iconbtn" data-close><i class="fa-solid fa-xmark"></i></button></span>
      </div>
      <div class="mj-modal-body">
        <p class="small">Void is available <b>only</b> from Draft or Quoted. Nothing has booked yet, so nothing has
        to be unwound — the order simply stops existing as a commitment.</p>
        <div class="mj-banner mj-banner--neutral">
          <i class="fa-solid fa-circle-info"></i>
          <div class="body">Once an order confirms, this button becomes <b>Create reversal…</b> instead. Booked
          history is never edited: corrections are new orders that mirror the original.</div>
        </div>
        <div class="mj-field" style="margin-top:var(--mj-space-4)"><label>Reason</label>
          <input class="mj-input" placeholder="Optional note for the record"></div>
      </div>
      <div class="mj-modal-foot"><span class="right">
        <button class="mj-btn mj-btn--flat" data-close>Keep editing</button>
        <button class="mj-btn mj-btn--danger" data-close>Void order</button></span></div>
    </div>

    <!-- confirm pre-flight -->
    <div class="mj-modal mj-modal--wide" id="preflight">
      <div class="mj-modal-head">
        <i class="fa-solid fa-clipboard-check" style="color:var(--mj-brand-primary)"></i>
        <div><h2>Before this books</h2>
          <div class="small muted">ORD-1016 · $1,621.57 · confirming is the irreversible step</div></div>

<script src="../assets/data.js"></script>
<script src="../assets/shell.js"></script>
<script>
const O = DB.orderByNumber('ORD-1016');
const H = MJ.H;

/* ── identity + stage + money ─────────────────────────────────────────────── */
function renderChrome() {
  document.getElementById('ed-meta').innerHTML =
    H.orderStatus(O.status) + ' ' + H.payStatus(O.paymentStatus) + ' ' + H.origin(O.origin);

  document.getElementById('ed-identity').innerHTML = `
    <div><span class="l">Order</span><span class="v mono">${O.number}</span></div>
    <div><span class="l">Type</span><span class="v">${O.type}</span></div>
    <div><span class="l">Order date</span><span class="v">${F.date(O.orderDate)}</span></div>
    <div><span class="l">Due</span><span class="v">${F.date(O.dueDate)}</span></div>
    <div><span class="l">Owning company</span><span class="v">${DB.companies[O.companyID].short}</span></div>
    <div><span class="l">Sales rep</span><span class="v">${O.rep}</span></div>
    <div><span class="l">Their PO</span><span class="v mono">${O.externalDocNumber || '—'}</span></div>`;

  const stages = [
    { k: 'Draft', reachable: true },
    { k: 'Quoted', reachable: true, note: 'Optional — skipping straight to Confirmed is legal' },
    { k: 'Confirmed', reachable: true, note: 'Books the journal entries — fires exactly once' },
    { k: 'Posted', reachable: false, note: 'Needs Confirmed first' },
    { k: 'Fulfilled', reachable: false, note: 'Line 2 must ship — this will not auto-advance' },
  ];
  const at = stages.findIndex(s => s.k === O.status);
  document.getElementById('ed-stepper').innerHTML = stages.map((s, i) => {
    const cls = i < at ? 'is-done' : i === at ? 'is-current' : s.reachable ? '' : 'is-blocked';
    const icon = i < at ? '<i class="fa-solid fa-check"></i>' : '';
    return `<span class="step ${cls}" title="${s.note || ''}">${icon}${s.k}</span>` +
           (i < stages.length - 1 ? '<span class="sep"><i class="fa-solid fa-chevron-right"></i></span>' : '');
  }).join('');

  document.getElementById('ed-stage-note').innerHTML =
    `Stage order is fixed; skipping <i>forward</i> is allowed. Void is reachable only from Draft or Quoted —
     after Confirm, corrections are reversing orders.`;

  document.getElementById('ed-money').innerHTML = `
    <div><span class="l">Total</span><span class="v">${F.money(O.gross)}</span></div>
    <div><span class="l">Paid</span><span class="v mj-money--muted">${O.paid ? F.money(O.paid) : '—'}</span></div>
    <div><span class="l">Balance</span><span class="v">${F.money(O.balance)}</span></div>
    <div>${H.payStatus(O.paymentStatus)}
      <span class="small muted">rollups maintained by trigger from the lines — never authored</span></div>`;
}

/* ── lines ───────────────────────────────────────────────────────────────── */
function renderLines() {
  document.getElementById('ed-lines').innerHTML = O.lines.map(l => {
    const p = DB.products[l.productID], t = DB.productTypes[p.typeID];
    const conseq = [];
    if (l.subscription) conseq.push(`<span class="mj-consequence is-sub"><i class="fa-solid fa-rotate"></i>
      ${l.subscription.action === 'extend' ? 'Extends' : 'Creates'} ${l.subscription.number} · ${l.subscription.beneficiary} → ${F.dateShort(l.subscription.through)}</span>`);
    if (l.servicePeriodFrom) conseq.push(`<span class="mj-consequence is-event"><i class="fa-solid fa-calendar-day"></i>
      Period from ${l.servicePeriodFrom}</span>`);
    if (l.servicePeriod && !l.servicePeriodFrom) conseq.push(`<span class="mj-consequence is-defer"><i class="fa-solid fa-hourglass-half"></i>
      ${F.dateShort(l.servicePeriod[0])} – ${F.dateShort(l.servicePeriod[1])}</span>`);
    if (l.fulfilment === 'Pending') conseq.push(`<span class="mj-consequence"><i class="fa-solid fa-dolly"></i> Ships</span>`);
    if (l.taxZeroReason) conseq.push(`<span class="mj-consequence"><i class="fa-solid fa-ban"></i> Untaxable</span>`);

    return `<tr class="is-clickable" data-row="${l.n}">
      <td class="muted">${l.n}</td>
      <td>
        <div class="ed-line-nm"><span class="primary">${p.name}</span>
          <span class="secondary">${p.sku} · ${t.name}</span></div>
        <div class="ed-line-conseq">${conseq.join('')}</div>
      </td>
      <td>${H.company(l.companyID)}</td>
      <td class="num">${F.qty(l.qty)}</td>
      <td class="num">
        ${F.money(l.unitPrice)}
        <div class="secondary"><i class="fa-solid fa-tag"></i> ${l.priceSource.rule}</div>
      </td>
      <td class="num">${l.discAmt ? `<span class="mj-money--credit">−${F.money(l.discAmt)}</span>
        <div class="secondary">SPRING10</div>` : '<span class="muted">—</span>'}</td>
      <td class="num strong">${F.money(l.net)}</td>
      <td class="num">${l.tax ? F.money(l.tax) + `<div class="secondary">3 layers</div>` : '<span class="muted">$0.00</span>'}</td>
      <td class="num strong">${F.money(l.gross)}</td>
      <td><button class="mj-iconbtn" title="Line detail"><i class="fa-solid fa-chevron-right"></i></button></td>
    </tr>`;
  }).join('');

  const t = document.querySelector('#ed-lines').closest('table').querySelector('tfoot');
  t.innerHTML = `<tr class="is-total">
    <td colspan="6">Order totals</td>
    <td class="num">${F.money(O.net)}</td>
    <td class="num">${F.money(O.tax)}</td>
    <td class="num">${F.money(O.gross)}</td><td></td></tr>`;
}

/* ── promotions + ladder ─────────────────────────────────────────────────── */
function renderPromos() {
  document.getElementById('ed-promos').innerHTML = O.promotions.map(p => {
    if (p.status === 'applied') {
      return `<div class="row-t" style="padding:var(--mj-space-2) 0;border-bottom:1px solid var(--mj-border-subtle)">
        <i class="fa-solid fa-circle-check" style="color:var(--mj-status-success);margin-top:3px"></i>
        <div style="flex:1">
          <div><b class="mono">${p.code}</b> ${p.name}</div>
          <div class="small muted">${p.scope}-scoped · ${F.pct(p.value)} of ${F.money(p.on)} · line ${p.lines.join(', ')}</div>
        </div>
        <span class="mj-num strong mj-money--credit">−${F.money(p.applied)}</span></div>`;
    }
    return `<div class="row-t" style="padding:var(--mj-space-2) 0;border-bottom:1px solid var(--mj-border-subtle)">
      <i class="fa-solid fa-circle-minus muted" style="margin-top:3px"></i>
      <div style="flex:1">
        <div><b class="mono">${p.code}</b> ${p.name} <span class="mj-chip mj-chip--outline">offered, not applied</span></div>
        <div class="small muted">${p.why}</div>
      </div>
      <span class="mj-num muted">—</span></div>`;
  }).join('') + `
    <div class="row" style="margin-top:var(--mj-space-3)">
      <input class="mj-input" placeholder="Add a promotion code…" style="max-width:220px">
      <button class="mj-btn mj-btn--outline mj-btn--sm">Apply</button>
      <span class="small muted spacer">A loser in a non-stacking collision is recorded too — highest value wins.</span>
    </div>
    <div class="mock-note">Recording what was <b>offered and not applied</b> is not bookkeeping trivia: it is the
      only way to answer &ldquo;why didn't my code work?&rdquo; without re-running the engine by hand.</div>`;

  document.getElementById('ed-ladder').innerHTML = `
    <div class="mj-ladder-row"><span class="label">Subtotal at list</span><span class="amt">${F.money(1600)}</span></div>
    <div class="mj-ladder-row is-sub is-discount"><span class="label">SPRING10</span><span class="amt">−${F.money(40)}</span></div>
    <div class="mj-ladder-row"><span class="label"><b>Net after discounts</b></span><span class="amt">${F.money(O.net)}</span></div>
    <div class="mj-ladder-row"><span class="label">Shipping</span><span class="amt">${F.money(O.charges)}</span></div>
    <div class="mj-ladder-row"><span class="label">Tax · 3 layers on $385.00</span><span class="amt">${F.money(O.tax)}</span></div>
    <div class="mj-ladder-row is-total"><span class="label">Total</span><span class="amt">${F.money(O.gross)}</span></div>`;
}

/* ── parties ─────────────────────────────────────────────────────────────── */
function renderParties() {
  const p = DB.people[O.billToPersonID], org = DB.orgs[O.billToOrgID];
  document.getElementById('ed-billto').innerHTML = `
    <div class="mj-field"><label>Organization</label>
      <input class="mj-input" value="${org.name}">
      <div class="hint"><i class="fa-solid fa-wand-magic-sparkles"></i> Inferred from Jane Chen's
        <b>Employee</b> affiliation, effective Mar 2019 — and stamped, not derived on read.</div></div>
    <div class="mj-field"><label>Person</label><input class="mj-input" value="${p.name}"></div>
    <div class="mj-field"><label>Address</label>
      <textarea class="mj-input" rows="2">${DB.addresses[O.billToAddressID].lines.join('\n')}</textarea></div>
    <div class="mj-stated"><span class="muted small" style="width:96px">Terms</span>
      <span class="value">Net 30</span><span class="from">organization default</span></div>`;

  document.getElementById('ed-shipto').innerHTML = `
    <div class="mj-field"><label>Organization</label>
      <input class="mj-input" value="" placeholder="— none —">
      <div class="hint">Blank is meaningful: it falls back per side, independently.</div></div>
    <div class="mj-field"><label>Person</label><input class="mj-input" value="${DB.people[O.shipToPersonID].name}"></div>
    <div class="mj-field"><label>Address</label>
      <textarea class="mj-input" rows="2">${DB.addresses[O.shipToAddressID].lines.join('\n')}</textarea>
      <div class="hint"><i class="fa-solid fa-triangle-exclamation" style="color:var(--mj-status-warning)"></i>
        California — this address is what pulls in three tax layers.</div></div>`;

  document.getElementById('ed-lineparties').innerHTML = `
    <table class="mj-table mj-table--compact">
      <thead><tr><th style="width:30px">#</th><th>Product</th><th>Ship-to resolution</th><th style="width:120px">Source</th></tr></thead>
      <tbody>
        <tr><td class="muted">1</td><td>Annual Membership</td>
          <td>Nothing to ship — the line's party says <b>who it is for</b>: Jane Chen</td>
          <td><span class="mj-chip mj-chip--outline">line</span></td></tr>
        <tr><td class="muted">2</td><td>Printed Handbook</td>
          <td>1180 Wilshire Blvd, Los Angeles CA</td>
          <td><span class="mj-chip mj-chip--outline">header</span></td></tr>
      </tbody>
    </table>
    <div class="small muted" style="margin-top:var(--mj-space-2)">Resolution is three tiers per side — the line,
      then the order's ship-to, then the customer. So an order shipping to one recipient states it once on the
      header, and a line overrides only when it differs.</div>`;
}

/* ── charges & tax ───────────────────────────────────────────────────────── */
function renderCharges() {
  document.getElementById('ed-charges').innerHTML = O.orderCharges.map(c => `
    <tr>
      <td class="num muted">${c.seq}</td>
      <td><b>${c.name}</b>${c.jurisdiction ? `<div class="secondary">${c.jurisdiction}</div>` : ''}
        ${c.isTax ? '<span class="mj-chip mj-chip--info">tax</span>' : '<span class="mj-chip mj-chip--outline">charge</span>'}</td>
      <td class="small">${c.basis}</td>
      <td class="num">${c.basisAmount != null ? F.money(c.basisAmount) : '<span class="muted">—</span>'}</td>
      <td class="num">${c.rate != null ? F.rate(c.rate) : '<span class="muted">—</span>'}</td>
      <td class="num strong">${F.money(c.amount)}</td>
      <td>${c.appliesToLine ? `<span class="mj-chip mj-chip--outline">line ${c.appliesToLine}</span>` : '<span class="muted">order</span>'}</td>
      <td>${c.isTax
        ? '<span class="small muted">from provider</span>'
        : '<button class="mj-btn mj-btn--flat mj-btn--sm" data-open="#override"><i class="fa-solid fa-pen"></i> Override</button>'}</td>
    </tr>`).join('') + `
    <tr class="is-total"><td></td><td colspan="4">Charges + tax</td>
      <td class="num">${F.money(O.charges + O.tax)}</td><td colspan="2"></td></tr>`;

  const b = O.taxableBase;
  document.getElementById('ed-basebox').innerHTML = `
    <span>Taxable goods <span class="muted">— line 2, tangible</span></span><span class="amt">${F.money(b.goods)}</span>
    <span class="muted">Untaxable goods <span class="tiny">— line 1, education</span></span><span class="amt muted">excluded (${F.money(b.untaxableGoods)})</span>
    <span>Non-tax charges <span class="muted">— shipping, seq 10</span></span><span class="amt">+ ${F.money(b.nonTaxCharges)}</span>
    <span class="muted tiny">Tax charges <span>— seq 100–120</span></span><span class="amt muted tiny">never enlarge the base</span>
    <span class="tot">Taxable base</span><span class="amt tot">${F.money(b.base)}</span>`;

  document.getElementById('ed-taxwhy').innerHTML = O.lines.map(l => {
    const p = DB.products[l.productID];
    if (l.taxZeroReason) {
      return `<div style="padding:var(--mj-space-2) 0;border-bottom:1px solid var(--mj-border-subtle)">
        <div class="row"><b>Line ${l.n} · ${p.name}</b>
          <span class="spacer mj-chip mj-chip--outline">$0.00</span></div>
        <div class="small muted">${l.taxZeroReason}</div>
        <div class="tiny muted" style="margin-top:3px">A zero always records <b>which</b> of four reasons produced
          it — untaxable, no nexus, exempt, or no jurisdiction. This one is untaxable.</div></div>`;
    }
    return `<div style="padding:var(--mj-space-2) 0;border-bottom:1px solid var(--mj-border-subtle)">
      <div class="row"><b>Line ${l.n} · ${p.name}</b>
        <span class="spacer mj-num strong">${F.money(l.tax)}</span></div>
      <div class="small muted">Taxable — ${p.taxCategory}, resolved from ${p.taxableFrom}. Ship-to is California,
        BC Media has nexus there, and this buyer holds no exemption.</div>
      <div class="small" style="margin-top:4px">${l.taxLayers.map(x =>
        `<div class="row"><span class="muted">${x.name} · ${F.rate(x.rate)}</span>
         <span class="spacer mj-num">${F.money(x.amount)}</span></div>`).join('')}</div></div>`;
  }).join('');
}

/* ── payment intent ─────────────────────────────────────────────────────── */
function renderIntent() {
  const ip = O.initialPayment;
  document.getElementById('ed-intent').innerHTML = `
    <div class="grid-2">
      <div class="mj-field"><label>Tender</label>
        <select class="mj-select">${DB.paymentTypes.filter(t => !t.isReversal).map(t =>
          `<option ${t.code === ip.typeCode ? 'selected' : ''}>${t.name}</option>`).join('')}</select>
        <div class="hint">Reversal types are excluded here by data, not by a hardcoded list.</div></div>
      <div class="mj-field"><label>Amount</label>
        <input class="mj-input is-num" value="${F.money(ip.amount).replace('$','')}">
        <div class="hint">Defaults to the full balance.</div></div>
    </div>
    <div class="mj-stated" style="border-top:1px solid var(--mj-border-subtle);padding-top:var(--mj-space-3)">
      <span class="muted small" style="width:96px">Instrument</span>
      <span class="value"><i class="fa-brands fa-cc-visa"></i> ${ip.instrument.brand} ···· ${ip.instrument.last4} · exp ${ip.instrument.exp}</span>
      <span class="from">copied from the wallet</span>
    </div>
    <div class="small muted" style="margin-top:var(--mj-space-2)">
      The wallet entry is <b>copied, never shared</b>. This order gets its own immutable snapshot, so the payment
      that eventually books cannot drift if the saved card is later edited or removed — and
      &ldquo;every payment made with this card&rdquo; stays answerable through the provenance link.
    </div>
    <div class="mj-banner mj-banner--info" style="margin-top:var(--mj-space-3)">
      <i class="fa-solid fa-circle-info"></i>
      <div class="body">Because a card is on file and the amount equals the balance, confirming will capture
      <b>${F.money(ip.amount)}</b> and book the cash leg: Dr Cash net of fees, Dr Processing Fee, Cr A/R at
      <b>gross</b>. Crediting A/R net of the fee would leave a residue no payment could ever clear.</div>
    </div>`;
}

/* ── accounting ─────────────────────────────────────────────────────────── */
function renderAccounting() {
  document.getElementById('ed-jes').innerHTML = O.je.map(j => {
    const dr = j.lines.filter(x => x.dr).reduce((s, x) => s + x.amount, 0);
    const cr = j.lines.filter(x => x.cr).reduce((s, x) => s + x.amount, 0);
    const line = O.lines.find(l => l.n === j.line);
    return `<div class="ed-je">
      <div class="ed-je-head">
        <b>${DB.companies[j.company].name}</b>
        <span class="muted">line ${j.line} · ${DB.products[line.productID].name}</span>
        <span class="spacer mj-chip ${Math.abs(dr - cr) < 0.005 ? 'mj-chip--success' : 'mj-chip--error'}">
          <i class="fa-solid fa-scale-balanced"></i> balanced</span>
        <span class="mj-chip mj-chip--outline">not yet created</span>
      </div>
      <table>
        ${j.lines.map(x => `<tr>
          <td class="side">${x.dr ? 'Dr' : 'Cr'}</td>
          <td>${x.dr || x.cr}</td>
          <td class="amt">${F.money(x.amount)}</td></tr>`).join('')}
        <tr class="foot"><td class="side"></td><td>Totals</td>
          <td class="amt">${F.money(dr)} / ${F.money(cr)}</td></tr>
      </table>
    </div>`;
  }).join('');

  // recognition waterfall — 12 forward-dated entries
  const rows = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(2027, 7 + i, 1);
    rows.push({ date: d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }), amount: 100.00 });
  }
  document.getElementById('ed-waterfall').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px">
      ${rows.map(r => `<div style="border:1px solid var(--mj-border-default);border-radius:var(--mj-radius-sm);
        padding:6px 8px;text-align:center">
        <div class="tiny muted">${r.date}</div>
        <div class="mj-num small strong">${F.money(r.amount)}</div></div>`).join('')}
    </div>
    <div class="small muted" style="margin-top:var(--mj-space-3)">
      Each entry: Dr <b>2400 · Deferred Revenue</b> $100.00 / Cr <b>4010 · Program Revenue</b> $100.00, dated on
      the monthly anniversary. Batches only sweep forward-dated entries when the date filter explicitly reaches
      forward, so they sit harmlessly until their period arrives. A later change nets against these rather than
      editing them.
    </div>`;

  document.getElementById('ed-dims').innerHTML = O.lines.map(l => `
    <div class="row" style="padding:6px 0;border-bottom:1px solid var(--mj-border-subtle)">
      <span class="muted" style="width:120px">Line ${l.n}</span>
      <span>${(l.dimensions || []).map(d =>
        `<span class="mj-chip mj-chip--outline">${d.name}: ${d.value}</span>`).join(' ') || '<span class="muted">—</span>'}</span>
    </div>`).join('') + `<div class="muted tiny" style="padding-top:var(--mj-space-2)">
      Dimension tags on a line propagate into that line's journal-entry lines, so analytics slices the ledger the
      same way the order was tagged.</div>`;
}

/* ── the line drawer ────────────────────────────────────────────────────── */
function edOpenLine(n) {
  const l = O.lines.find(x => x.n === Number(n));
  const p = DB.products[l.productID], t = DB.productTypes[p.typeID];

  document.getElementById('ld-title').textContent = `Line ${l.n} · ${p.name}`;
  document.getElementById('ld-sub').innerHTML =
    `${p.sku} · ${t.name} · revenue to ${DB.companies[l.companyID].name}`;

  const stated = (label, value, from) => `
    <div class="mj-stated" style="border-bottom:1px solid var(--mj-border-subtle)">
      <span class="muted small" style="width:118px;flex:none">${label}</span>
      <span class="value" style="flex:1">${value}</span>
      ${from ? `<span class="from">${from}</span>` : ''}</div>`;

  document.getElementById('ld-body').innerHTML = `
    <div class="grid-2">
      <div class="mj-field"><label>Quantity</label><input class="mj-input is-num" value="${F.qty(l.qty)}"></div>
      <div class="mj-field"><label>Unit price</label><input class="mj-input is-num" value="${F.money(l.unitPrice).replace('$','')}">
        <div class="hint"><i class="fa-solid fa-tag"></i> ${l.priceSource.list} · ${l.priceSource.rule}</div></div>
      <div class="mj-field"><label>Discount %</label><input class="mj-input is-num" value="${(l.discPct*100).toFixed(2)}"></div>
      <div class="mj-field"><label>Discount amount</label><input class="mj-input is-num" value="${l.discAmt.toFixed(2)}">
        ${l.discAmt ? '<div class="hint">Set by SPRING10, not typed.</div>' : ''}</div>
    </div>

    <div class="sec-label" style="margin-top:var(--mj-space-4)">Who this line is for</div>
    ${l.n === 1
      ? stated('Beneficiary', 'Jane Chen', 'line ship-to person') +
        stated('Holder', 'Meridian Association', 'order bill-to') +
        `<div class="small muted" style="padding-top:var(--mj-space-2)">Nothing ships, so the ship-to party names
         the person who benefits. The subscription type's benefit model decides that the <b>named individual</b>
         matters here, which is also what stops ten seats for ten staff colliding as duplicates.</div>`
      : stated('Ship-to address', DB.addresses[l.shipToAddressID].lines.join(', '), l.shipToNote) +
        stated('Ship-to person', '— none —', 'falls back per side') +
        stated('Ship-to organization', '— none —', 'falls back per side')}

    <div class="sec-label" style="margin-top:var(--mj-space-4)">Timing</div>
    ${l.servicePeriod
      ? stated('Service period', `${F.date(l.servicePeriod[0])} – ${F.date(l.servicePeriod[1])}`,
               l.servicePeriodFrom || 'subscription term')
      : stated('Service period', '— none —', 'immediate recognition')}
    ${stated('Revenue recognition', t.revRec, `product type ${t.name}`)}
    ${l.fulfilment ? stated('Fulfillment', l.fulfilment, 'product type requires it') : ''}

    ${l.subscription ? `
    <div class="sec-label" style="margin-top:var(--mj-space-4)">Subscription</div>
    <div class="mj-banner mj-banner--info">
      <i class="fa-solid fa-rotate"></i>
      <div class="body"><b>${l.subscription.action === 'extend' ? 'Extends' : 'Creates'} ${l.subscription.number}</b>
        — coverage to ${F.date(l.subscription.through)}.
        <div class="small" style="margin-top:4px">Renewals and extensions <b>append a term</b> rather than moving a
        pointer, so &ldquo;current&rdquo; is the term whose window covers today — a query, not a field that goes stale.</div>
        <div style="margin-top:6px"><a href="../receivables/subscriptions.html">Open ${l.subscription.number} ↗</a></div>
      </div>
    </div>` : ''}

    <div class="sec-label" style="margin-top:var(--mj-space-4)">Tax</div>
    ${l.taxZeroReason
      ? `<div class="small muted">${l.taxZeroReason}</div>`
      : `<table class="mj-table mj-table--compact"><thead><tr><th>Layer</th><th class="num">Rate</th>
         <th class="num">Base</th><th class="num">Amount</th></tr></thead><tbody>
         ${l.taxLayers.map(x => `<tr><td>${x.name}</td><td class="num">${F.rate(x.rate)}</td>
           <td class="num">${F.money(x.base)}</td><td class="num">${F.money(x.amount)}</td></tr>`).join('')}
         </tbody></table>`}

    <div class="sec-label" style="margin-top:var(--mj-space-4)">Dimension tags</div>
    <div class="row wrap">
      ${(l.dimensions || []).map(d => `<span class="mj-chip mj-chip--outline">${d.name}: ${d.value}
        <button class="mj-why"><i class="fa-solid fa-xmark"></i></button></span>`).join('')}
      <button class="mj-btn mj-btn--flat mj-btn--sm"><i class="fa-solid fa-plus"></i> Tag</button>
    </div>

    <div class="sec-label" style="margin-top:var(--mj-space-4)">Reversal</div>
    <div class="small muted">This line reverses nothing. A line that did would inherit the origin's price and
      would be capped at the quantity still returnable there.</div>

    <div class="mock-note">Thirteen fields, every one defaulted from somewhere upstream. Putting them on the row
      would make the common case unreadable to serve the rare one.</div>`;

  MJ.open('#line-drawer');
}

        <a href="#" data-close data-open="#preflight-blocked">See what this looks like when something is wrong →</a>

      <div class="mj-panel-body">
        ${O.je.map(j => {

    <details class="mj-panel" open>

        Jul 31, 2027 to <b>Jul 31, 2028</b> by appending term #3.
        <div style="margin-top:6px">Because this <i>extends</i> rather than duplicates, the type's concurrency rule
        is satisfied; 12 forward-dated recognition entries stage against the new term's own window.</div>
      </div>
    </details>

    <details class="mj-panel">
      <summary><i class="fa-solid fa-credit-card"></i> Payment
        <span class="right"><span class="mj-chip mj-chip--info">captures ${F.money(O.gross)}</span></span></summary>
      <div class="mj-panel-body small">
        The initial-payment intent becomes PaymentHeader + PaymentLine, applied to this order, and books the cash
        leg in the same transaction: Dr Cash (net of a $47.03 fee) · Dr Processing Fee · Cr A/R at gross.
        <div class="muted" style="margin-top:6px">If the card declines, nothing persists — not the payment, not the
        booking, not the confirm.</div>

    <details class="mj-panel">

    <details class="mj-panel">
      <summary><i class="fa-solid fa-user-check"></i> Approvals
