<div class="mjo-acct-widget-wrap">
    <div class="mjo-acct-card">
        <div class="mjo-card-head">
            <i class="fa-solid fa-scale-balanced"></i>
            <span>General Ledger &amp; Revenue Recognition Classification</span>
        </div>
        <div class="mjo-card-body">
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="RevenueRecognitionTypeID"
                Type="textbox"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                LinkType="Record"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="IsTaxable"
                Type="checkbox"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="TaxCategory"
                Type="textbox"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="StandaloneSellingPrice"
                Type="number"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
        </div>
    </div>

    <!--
        bizapps-orders#113 — the GL accounts this product books to.

        Andrew expected these HERE, under Accounting, and the section showed only the
        product's own columns. The links live in accounting, but they are polymorphic
        ((EntityID, RecordID)) and accounting must not depend on orders, so its own screen
        cannot even name a product. Rendering them from this side is what makes the pair
        something nobody has to type.
    -->
    <div class="mjo-acct-card">
        <div class="mjo-card-body">
            <bizapps-product-gl-links
                [Product]="Product"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)">
            </bizapps-product-gl-links>
        </div>
    </div>
</div>
