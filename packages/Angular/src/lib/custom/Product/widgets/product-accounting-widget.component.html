<!--
    CARD SHELL — the product's own fields are PROJECTED by the caller.
    Same reason as the fulfillment and subscription widgets: mj-collapsible-panel reads its
    fields through @ContentChildren, which cannot see a field declared inside a child
    component's view. That query drives hide-when-empty (golive#184) and the rail badge
    (golive#255), so the fields are declared in the panel template and projected in here.

    StandaloneSellingPrice is deliberately deprecated off generated forms by
    metadata/entities/.product-standalone-selling-price-deprecation.json and is NOT rendered.

    ORDER OF THE THREE CARDS. Setup first (the product's own accounting columns), then the accounts
    an order would actually post to (the question a reader has), then the product-level links that
    override the inherited ones (the editing surface). The second card asks the server's walk
    (golive#439); the third lists only links on the product itself (bizapps-orders#113).
-->
<div class="mjo-acct-widget-wrap">
    <section class="mjo-acct-card">
        <header class="mjo-acct-card__head">
            <div class="mjo-acct-card__titles">
                <h3 class="mjo-acct-card__title"><i class="fa-solid fa-book"></i>Accounting setup</h3>
            </div>
        </header>
        <div class="mjo-acct-card__body mjo-acct-fields">
            <ng-content></ng-content>
        </div>
    </section>

    <section class="mjo-acct-card">
        <!-- The two ids are bound on their own so an edit on the form reaches the card (see its ngOnChanges). -->
        <bizapps-product-effective-gl-accounts
            #effective
            [Product]="Product"
            [RevenueRecognitionTypeID]="Product?.RevenueRecognitionTypeID"
            [CompanyID]="Product?.CompanyID">
        </bizapps-product-effective-gl-accounts>
    </section>

    <section class="mjo-acct-card">
        <bizapps-product-gl-links
            [Product]="Product"
            [EditMode]="EditMode"
            [FormContext]="FormContext"
            (Navigate)="Navigate.emit($event)"
            (LinksChanged)="effective.Refresh()">
        </bizapps-product-gl-links>
    </section>
</div>
