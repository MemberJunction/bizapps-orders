<div class="mjo-pricing-widget-wrap">
    <!-- Top Commercial Terms Card -->
    <div class="mjo-pricing-card">
        <div class="mjo-card-header">
            <div class="mjo-card-title">
                <i class="fa-solid fa-calculator"></i>
                <span>Base Commercial Terms &amp; ASC 606 Allocation</span>
            </div>
        </div>
        <div class="mjo-pricing-fields">
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="StandaloneSellingPrice"
                Type="numerictextbox"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)">
            </mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="RevenueRecognitionTypeID"
                Type="textbox"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                LinkType="Record"
                (Navigate)="Navigate.emit($event)">
            </mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="IsTaxable"
                Type="checkbox"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)">
            </mj-form-field>
        </div>
    </div>

    <!-- Price Lists & Volume Tiers Grid -->
    <div class="mjo-pricing-card">
        <div class="mjo-card-header">
            <div class="mjo-card-title">
                <i class="fa-solid fa-tags"></i>
                <span>Price Lists &amp; Custom Volume Tiers</span>
            </div>
        </div>

        @if (ProductPricesViewParams) {
            <div class="mjo-grid-wrap">
                <mj-explorer-entity-data-grid
                    [Params]="ProductPricesViewParams"
                    [NewRecordValues]="NewPriceRecordValues"
                    [Height]="400"
                    [AllowLoad]="true"
                    [ShowToolbar]="true"
                    [ShowNewButton]="true"
                    (Navigate)="Navigate.emit($event)">
                </mj-explorer-entity-data-grid>
            </div>
        }
    </div>
</div>
