<div class="mjo-ful-widget-wrap">
    <div class="mjo-ful-card">
        <div class="mjo-card-head">
            <i class="fa-solid fa-truck-fast"></i>
            <span>Catalog Availability &amp; Entitlement Timing</span>
        </div>
        <div class="mjo-card-body">
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="AvailableFrom"
                Type="datepicker"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="AvailableTo"
                Type="datepicker"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="EntitlementGrantTiming"
                Type="select"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="EntitlementQuantityMode"
                Type="select"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="EntitlementValidityMode"
                Type="select"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="SuccessorProductID"
                Type="textbox"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                LinkType="Record"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
        </div>
    </div>
</div>
