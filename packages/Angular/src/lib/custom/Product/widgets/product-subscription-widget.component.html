<div class="mjo-sub-widget-wrap">
    <div class="mjo-sub-card">
        <div class="mjo-card-head">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span>Recurring Subscription Classification</span>
        </div>
        <div class="mjo-card-body">
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="SubscriptionTypeID"
                Type="textbox"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                LinkType="Record"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="EntitlementValidityMode"
                Type="select"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)"
            ></mj-form-field>
        </div>
    </div>

    <!-- Product Entitlements Grid -->
    <div class="mjo-ent-panel">
        <div class="mjo-panel-head">
            <div class="mjo-panel-title">
                <i class="fa-solid fa-key"></i>
                <span>Granted Entitlements &amp; Permissions</span>
            </div>
        </div>

        @if (ProductEntitlementsViewParams) {
            <div class="mjo-grid-container">
                <mj-explorer-entity-data-grid
                    [Params]="ProductEntitlementsViewParams"
                    [AllowLoad]="true"
                    [ShowToolbar]="true"
                    [ShowNewButton]="true"
                    (Navigate)="Navigate.emit($event)">
                </mj-explorer-entity-data-grid>
            </div>
        }
    </div>
</div>
