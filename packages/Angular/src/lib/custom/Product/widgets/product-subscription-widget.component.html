<!--
    CARD SHELL ONLY — the fields are PROJECTED by the caller.

    mj-collapsible-panel decides "this section is empty, hide it" from
    @ContentChildren(MjFormFieldComponent), and a content query cannot see across a
    component view boundary. While the mj-form-fields lived in this template the panel
    counted zero fields, treated the section as non-field content, and kept the shell —
    which is the bare "Subscription Management" header reported in golive#184. Declaring
    them in the panel's template and projecting them here keeps this card's chrome and
    lets MJ's existing hide-when-empty logic see them.
-->
<div class="mjo-sub-widget-wrap">
    <div class="mjo-sub-card">
        <div class="mjo-card-head">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span>Recurring Subscription &amp; Renewal Settings</span>
        </div>
        <div class="mjo-card-body">
            <ng-content></ng-content>
        </div>
    </div>
</div>
