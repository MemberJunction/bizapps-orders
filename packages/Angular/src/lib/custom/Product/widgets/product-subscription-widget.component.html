<div class="mjo-sub-widget-wrap">
    <div class="mjo-sub-card">
        <div class="mjo-card-head">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span>Recurring Subscription &amp; Renewal Settings</span>
        </div>
        <div class="mjo-card-body">
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="SubscriptionTypeID"
                Type="textbox"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                LinkType="Record"
                (Navigate)="Navigate.emit($event)">
            </mj-form-field>
            <mj-form-field 
                [Record]="Product"
                [ShowLabel]="true"
                FieldName="EntitlementValidityMode"
                Type="select"
                [EditMode]="EditMode"
                [FormContext]="FormContext"
                (Navigate)="Navigate.emit($event)">
            </mj-form-field>
        </div>
    </div>
</div>
