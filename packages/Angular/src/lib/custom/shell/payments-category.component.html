<mj-page-layout>
  <!-- FULL WIDTH, ABOVE the rail — MJ's canonical shell shape (admin-container), and what makes the
       header stay put while the body scrolls: mj-page-layout is overflow:hidden, the header is a
       natural-height sibling, and the body owns overflow-y:auto. Deliberately TIGHT: one line, no
       subtitle, no stacking. -->
  <!-- Header = the CATEGORY (Marcelo 2026-07-16): the sub-page name is already the rail's active
       item inches away, so restating it bought nothing; the category is the context that ISN'T
       otherwise on screen. That frees the bar to carry things worth the space: the company scope,
       category-level composite stats that stay meaningful across every sub-page, and one refresh in
       a reliable place instead of repeated in every body.

       Chips + scope ride [actions] rather than [meta] because [meta] renders BELOW the identity —
       a second line, which is exactly the wasted space this header exists to avoid. Requested
       upstream as an inline-meta placement (MJ-UPSTREAM.md); they move to [meta] when it lands. -->
  <mj-page-header [Title]="CategoryTitle" [Icon]="CategoryIcon">
    <div actions>
      <mj-company-scope-chip></mj-company-scope-chip>
      @for (s of HeaderStats; track s.Label) {
        <mj-stat-badge [Label]="s.Label" [Icon]="s.Icon ?? ''" [Variant]="s.Variant ?? 'default'" [title]="s.Tooltip ?? ''"></mj-stat-badge>
      }
      <!-- Refreshes ONLY the page in the body — not the rail, not other pages in this category.
           Exactly one page is instantiated by the @switch below, so it is the only subscriber
           (see PageRefreshService). Hidden when the mounted page has nothing to reload, rather
           than offering a button that does nothing. -->
      @if (CanRefreshActivePage) {
        <mj-refresh-button (Clicked)="RefreshActivePage()"></mj-refresh-button>
      }
    </div>
  </mj-page-header>

  <mj-page-body [Flex]="true" [Padding]="false" Direction="row">
    <mj-left-nav
      [Sections]="RailSections"
      [ActiveId]="ActivePageId"
      [MobileTitle]="CategoryTitle"
      (ItemClicked)="OnRailItemClicked($event)">
    </mj-left-nav>

    <mj-left-nav-content>
      @switch (ActivePageId) {
        @case ('dashboard') {
          <mj-payments-dashboard-page></mj-payments-dashboard-page>
        }
        @case ('all-payments') {
          <mj-all-payments-page></mj-all-payments-page>
        }
        @case ('entry') {
          <mj-payment-entry-page></mj-payment-entry-page>
        }
        @case ('refunds') {
          <mj-refunds-page></mj-refunds-page>
        }
        @case ('methods') {
          <mj-payment-methods-page></mj-payment-methods-page>
        }
        @default {
          <mj-shell-page-pending [PageName]="PendingPageName(ActivePageId)"></mj-shell-page-pending>
        }
      }
    </mj-left-nav-content>
  </mj-page-body>
</mj-page-layout>
