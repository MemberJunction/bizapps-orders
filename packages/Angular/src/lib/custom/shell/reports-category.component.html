<mj-page-layout>
  <!-- Page header — FULL WIDTH, ABOVE the rail (Marcelo 2026-07-16). This is MJ's canonical shell
       shape (admin-container) and it is what makes the header stay put while the body scrolls:
       mj-page-layout is overflow:hidden, the header is a natural-height sibling, and the body owns
       overflow-y:auto.

       Title is the ACTIVE PAGE, not the category — the category is already the active item in
       Explorer's top nav, so repeating it here would waste the line. Deliberately TIGHT: no
       Subtitle, no [meta], no stacking — one line, per "that header is meant to say, here's the
       page you're on". Per-page actions/filters live in the interior card below. -->
  <mj-page-header [Title]="ActivePageLabel" [Icon]="ActivePageIcon"></mj-page-header>

  <mj-page-body [Flex]="true" [Padding]="false" Direction="row">
    <mj-left-nav
      [Sections]="RailSections"
      [ActiveId]="ActivePageId"
      [MobileTitle]="CategoryTitle"
      (ItemClicked)="OnRailItemClicked($event)">
      <div header>
        <mj-company-scope-chip></mj-company-scope-chip>
      </div>
    </mj-left-nav>

    <mj-left-nav-content>
      @switch (ActivePageId) {
        @case ('customer-ar') {
          <mj-customer-ar-page></mj-customer-ar-page>
        }
        @case ('overdue') {
          <!-- The SAME component the Orders rail renders — one page, two nav entries (§13.4). -->
          <mj-overdue-worklist-page></mj-overdue-worklist-page>
        }
        @default {
          <mj-shell-page-pending [PageName]="PendingPageName(ActivePageId)"></mj-shell-page-pending>
        }
      }
    </mj-left-nav-content>
  </mj-page-body>
</mj-page-layout>
