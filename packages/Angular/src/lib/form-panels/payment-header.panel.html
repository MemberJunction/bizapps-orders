<div class="mjo-doc-hero">
    <div class="mjo-doc-hero__identity">
        <div class="mjo-doc-hero__avatar" [class.mjo-doc-hero__avatar--reverse]="IsReversal">
            <i [class]="AvatarIcon" aria-hidden="true"></i>
        </div>
        <div class="mjo-doc-hero__copy">
            <div class="mjo-doc-hero__title-row">
                <h1 class="mjo-doc-hero__title">{{ Title }}</h1>
                <span [class]="StatusClass">{{ Record.Status || 'Draft' }}</span>
                @if (Record.PaymentType) {
                    <span class="mjo-doc-chip">{{ Record.PaymentType }}</span>
                }
                @if (IsReversal) {
                    <span class="mjo-doc-chip mjo-doc-chip--warn">
                        <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Reversal
                    </span>
                }
            </div>
        </div>
    </div>
    <div class="mjo-doc-hero__stats">
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Gross</span>
            <span class="mjo-doc-stat__value">{{ Money.Gross }}</span>
        </div>
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Fee</span>
            <span class="mjo-doc-stat__value">{{ Money.Fee }}</span>
        </div>
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Net</span>
            <span class="mjo-doc-stat__value">{{ Money.Net }}</span>
        </div>
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Payer</span>
            <span class="mjo-doc-stat__value">{{ Payer }}</span>
        </div>
    </div>
</div>
