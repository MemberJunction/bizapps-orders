<div class="mjo-doc-hero">
    <div class="mjo-doc-hero__identity">
        <div class="mjo-doc-hero__avatar">
            <i class="fa-solid fa-ticket" aria-hidden="true"></i>
        </div>
        <div class="mjo-doc-hero__copy">
            <div class="mjo-doc-hero__title-row">
                <h1 class="mjo-doc-hero__title">{{ Title }}</h1>
                <span class="mjo-doc-chip">{{ Record.Code || 'CODE TBD' }}</span>
                <span class="mjo-doc-chip">{{ ValueLabel }}</span>
                <span class="mjo-doc-chip">{{ Stacking }}</span>
                <span [class]="StatusClass">{{ Record.Status || 'Active' }}</span>
            </div>
        </div>
    </div>
    <div class="mjo-doc-hero__stats">
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Discount</span>
            <span class="mjo-doc-stat__value">{{ ValueLabel }}</span>
        </div>
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Schedule</span>
            <span class="mjo-doc-stat__value">{{ Schedule }}</span>
        </div>
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Max uses</span>
            <span class="mjo-doc-stat__value">{{ MaxUses }}</span>
        </div>
    </div>
</div>
