<div class="mjo-doc-hero">
    <div class="mjo-doc-hero__identity">
        <div class="mjo-doc-hero__avatar">
            <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
        </div>
        <div class="mjo-doc-hero__copy">
            <div class="mjo-doc-hero__title-row">
                <h1 class="mjo-doc-hero__title">{{ Title }}</h1>
                <span [class]="StatusClass">{{ Record.Status || 'Active' }}</span>
                @if (Record.IsProrated) {
                    <span class="mjo-doc-chip mjo-doc-chip--info">Prorated</span>
                }
            </div>
            <div class="mjo-doc-hero__meta">
                <span>Coverage: <strong>{{ Coverage }}</strong></span>
                @if (Record.SubscriptionID) {
                    <span>Subscription: <strong>{{ Subscription }}</strong></span>
                }
            </div>
        </div>
    </div>
    <div class="mjo-doc-hero__stats">
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Amount</span>
            <span class="mjo-doc-stat__value">{{ Amount }}</span>
        </div>
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Cycle</span>
            <span class="mjo-doc-stat__value">#{{ Record.TermNumber || 1 }}</span>
        </div>
    </div>
</div>
