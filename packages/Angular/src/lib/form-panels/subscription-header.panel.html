<div class="mjo-doc-hero">
    <div class="mjo-doc-hero__identity">
        <div class="mjo-doc-hero__avatar">
            <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
        </div>
        <div class="mjo-doc-hero__copy">
            <div class="mjo-doc-hero__title-row">
                <h1 class="mjo-doc-hero__title">{{ Title }}</h1>
                <span [class]="StatusClass">{{ Record.Status || 'Active' }}</span>
                <span [class]="AutoRenewClass">
                    <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
                    {{ Record.AutoRenew ? 'Auto-renews' : 'Manual renewal' }}
                </span>
            </div>
            <div class="mjo-doc-hero__meta">
                <span>Coverage: <strong>{{ Coverage }}</strong></span>
                @if (Record.Product) {
                    <span [mjRecordLink]="Record" FieldName="ProductID" [HandleClick]="false">{{ Record.Product }}</span>
                }
                @if (Record.Company) {
                    <span [mjRecordLink]="Record" FieldName="CompanyID" [HandleClick]="false">{{ Record.Company }}</span>
                }
            </div>
            <bizapps-related-chips
                [Links]="RelatedLinks"
                [Provider]="FormComponent.ProviderToUse"
                (Navigate)="FormComponent.OnFormNavigate($event)" />
        </div>
    </div>
    <div class="mjo-doc-hero__stats">
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Holder</span>
            <span class="mjo-doc-stat__value" [mjRecordLink]="Record" FieldName="HolderOrganizationID" [HandleClick]="false">{{ Holder }}</span>
        </div>
        <div class="mjo-doc-stat">
            <span class="mjo-doc-stat__label">Beneficiary</span>
            <span class="mjo-doc-stat__value" [mjRecordLink]="Record" FieldName="BeneficiaryPersonID" [HandleClick]="false">{{ Beneficiary }}</span>
        </div>
    </div>
    <mjo-subscription-cancel
        [Record]="Record"
        [Provider]="FormComponent.ProviderToUse"
        (Canceled)="OnCanceled()" />
</div>
