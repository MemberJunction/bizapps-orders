<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MemberJunction Explorer</title>
  <base href="/" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css?family=Ubuntu&display=swap" rel="stylesheet" />
  <!--
    Font Awesome 6, not 5.

    The Font Awesome KIT below is the only source of v6 syntax here, and it
    answers 403 off an allowlisted domain — so on localhost nothing served v6 and
    every `fa-solid` icon fell back to an empty box. That is not confined to this
    app's screens: MJ's own top navigation was boxed too, because it also writes
    v6 names.

    cdnjs serves v6 with no referrer check, and v6 keeps the v5 aliases (`fas`,
    `far`, `fab`), so nothing that renders today stops rendering. The kit stays
    for deployed environments where it does resolve.
  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://kit.fontawesome.com/6829eb2cdc.js" crossorigin="anonymous"></script>
</head>
<body>
<app-root></app-root> 
<app-redirect></app-redirect>
</body>
</html>
