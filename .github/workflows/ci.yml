name: CI

# Runs the whole verification chain on every PR and every push to next.
#
# WHY THIS EXISTS AT ALL: until this landed, all 177 integration checks ran only when someone
# remembered to run them. The suite has found more than twenty real defects — several of which
# balanced, totalled and looked correct — so "someone remembers" was the only thing standing between
# a wrong number and production.

on:
  pull_request:
  push:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_HOST: localhost
  DB_PORT: '1433'
  DB_USERNAME: sa
  DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'Str0ng!Passw0rd#CI' }}
  DB_DATABASE: bizapps_orders_ci
  DB_TRUST_SERVER_CERTIFICATE: 'true'
  MJ_CORE_SCHEMA: __mj
  # THE FLAG THAT MATTERS. Every check in this suite is RequiresMutation, and MJ's driver skips
  # those unless mutation is enabled — so a run without this reports success having executed
  # NOTHING. The count assertion at the end is the belt to this braces: it fails the build if fewer
  # checks ran than the registry declares, whichever path was taken.
  RUN_MUTATION_TESTS: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'Str0ng!Passw0rd#CI' }}
          MSSQL_PID: Developer
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      # The rebuild chain needs the sibling apps: bizapps-common's migrations and
      # bizapps-accounting's schema, which this app's FKs reference.
      - name: Check out bizapps-common
        uses: actions/checkout@v4
        with:
          repository: MemberJunction/bizapps-common
          path: ../bizapps-common
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}

      - name: Check out bizapps-accounting
        uses: actions/checkout@v4
        with:
          repository: MemberJunction/bizapps-accounting
          ref: ${{ vars.ACCOUNTING_REF || 'next' }}
          path: ../bizapps-accounting
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install sqlcmd
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Write .env
        run: |
          cat > .env <<EOF
          DB_HOST='${DB_HOST}'
          DB_PORT=${DB_PORT}
          DB_USERNAME='${DB_USERNAME}'
          DB_PASSWORD='${DB_PASSWORD}'
          DB_DATABASE='${DB_DATABASE}'
          DB_TRUST_SERVER_CERTIFICATE=true
          MJ_CORE_SCHEMA='${MJ_CORE_SCHEMA}'
          EOF

      # ── unit tests first: they need no database and fail in seconds ──────────
      - name: Unit tests
        run: npx vitest run

      # ── the full rebuild cycle, exactly as a developer runs it ───────────────
      # rebuild-db.sh trims the generated half before applying, so CodeGen regenerates from a bare
      # schema. That is what makes 'edit the baseline in place' safe, and running it here proves the
      # cycle still works rather than assuming it.
      - name: Rebuild database from zero
        run: bash scripts/rebuild-db.sh

      - name: CodeGen
        run: rm -rf migrations/codegen && npm run mj:codegen

      - name: Append CodeGen output
        run: bash scripts/append-codegen.sh

      # The generated half must be COMMITTED, not produced at deploy time — a fresh `mj migrate`
      # has to yield a working database. If regenerating changes what is checked in, the branch is
      # carrying a stale baseline and the migration would install bare tables.
      - name: Fail if the committed baseline is stale
        run: |
          if ! git diff --quiet -- migrations/; then
            echo "::error::The committed migration differs from what CodeGen produces."
            echo "Run: scripts/rebuild-db.sh && npm run mj:codegen && scripts/append-codegen.sh"
            git diff --stat -- migrations/
            exit 1
          fi

      - name: Push metadata
        run: npm run mj -- sync push --dir metadata

      - name: Build
        run: npm run build

      # ── integration checks, with the count assertion ─────────────────────────
      - name: Integration checks
        run: node test-harnesses/integration.mjs 2>&1 | tee /tmp/integration.log

      - name: Assert every registered check actually ran
        run: node scripts/assert-check-count.mjs /tmp/integration.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: /tmp/integration.log
          retention-days: 7
