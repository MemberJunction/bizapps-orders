name: CI

# UNIT TESTS ONLY, DELIBERATELY.
#
# The 366 integration checks need a SQL Server, checkouts of two sibling private repos, an MJ core
# migration and a metadata push. That is a local development environment, not a CI runner, and it is
# not worth pretending otherwise: the first version of this file tried, described itself as working,
# and failed on its third step having proved nothing (`actions/checkout` rejects a `path:` outside
# the workspace, and `github.token` cannot read a private sibling repo anyway).
#
# So the division of labour is explicit:
#
#   HERE          the pure engines — ~1000 tests, no environment, seconds. This is where the
#                 money arithmetic lives, so it is not a small gate. Volume vs Tiered banding,
#                 stacking, charge basis, the taxability walk, allocation, reversal rules, and the
#                 registry-parity guards that catch a bundle silently dropping out of the suite.
#
#   BEFORE MERGE  the integration suite, run locally against a real database:
#
#                     RUN_MUTATION_TESTS=1 node test-harnesses/integration.mjs
#                     node scripts/assert-check-count.mjs /tmp/integration.log
#
#                 `RUN_MUTATION_TESTS=1` is NOT optional. Every check in that suite is
#                 `RequiresMutation`, and MJ's driver contains `if (check.RequiresMutation &&
#                 !mutationEnabled) continue;` — so a run without it executes NOTHING and reports
#                 success. The count assertion exists because a green tally is not evidence on its
#                 own; it fails if fewer checks ran than the registry declares.
#
# The integration suite has found more than thirty real defects, several of which balanced, totalled
# and looked entirely correct. It is the more valuable of the two gates. It is just not one a hosted
# runner can honestly provide, and a red X that everybody learns to ignore is worse than a documented
# manual step.

on:
  pull_request:
  push:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # BUILD BEFORE TESTING. `registry-parity.test.ts` imports a workspace package by NAME, whose
      # `main` points at a `dist/` that `npm ci` does not produce — so without this the file fails
      # to RESOLVE and never executes. The suite still reported ~989 passing and a red X, which is
      # the worst shape a check can have: it looks like a known failure rather than a test that is
      # not running. Locally the same command reports 1065, and the missing 76 are exactly this file.
      #
      # `build:packages` rather than `build`: it compiles the six @mj-biz-apps/orders-* packages the
      # tests actually import, and skips mj_api / mj_explorer, which are MJ's apps and add Angular
      # build time for no coverage here.
      #
      # Second reason, independent of the test: CI could not previously catch a BUILD break at all.
      # package.json and package-lock.json disagreed about @types/express for 24 commits and every
      # `npm ci` failed — nobody noticed, because the check was already red for the other reason.
      - name: Build app packages
        run: npm run build:packages

      # Includes `registry-parity.test.ts`, which is the anti-vacuity floor: it asserts exact
      # per-bundle check counts against the filesystem and cross-checks the four places a bundle
      # name has to agree. Adding a bundle without a Test record, or a Test record that never joins
      # the suite, both leave the integration suite passing with strictly less in it — and both have
      # actually happened.
      - name: Unit tests
        run: npx vitest run

      # Advisory, not a gate. `migrations/_README.md` requires a changeset on any PR touching a
      # migration, and that rule sat unenforced through several schema changes. A warning annotation
      # is honest about what this is — a reminder in review — rather than a red X on documentation
      # PRs that legitimately have no version impact.
      - name: Changeset present?
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "::warning title=No changeset::This PR carries no changeset. One is required for any change to migrations/ or a published package — run 'npx changeset'."
          fi

      - name: State plainly what this gate does not cover
        if: always()
        run: |
          echo "::notice title=Integration checks are not run here::The 366 database checks need a local environment. Run 'RUN_MUTATION_TESTS=1 node test-harnesses/integration.mjs' before merging — see .github/workflows/ci.yml for why."
