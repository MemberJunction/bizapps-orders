name: CI

# What remains of orders' original CI after the release-pipeline port. The build and the unit
# tests now run in the shared build.yml (the same `vitest run` suite), so only the two
# orders-specific reminders stay here. Neither fails a PR.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reminders:
    name: PR reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Advisory, not a gate. changes.yml already REQUIRES a changeset for migration and metadata
      # changes; this also reminds on any other PR, since a change to a published package without a
      # changeset is never released. A warning, not a red X, because docs-only PRs legitimately have
      # no version impact.
      - name: Changeset present?
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "::warning title=No changeset::This PR carries no changeset. One is required for any change to migrations/ or a published package — run 'pnpm exec changeset'."
          fi

      - name: State plainly what CI does not cover
        run: |
          echo "::notice title=Integration checks are not run in CI::The database checks need a local environment. Run 'RUN_MUTATION_TESTS=1 node test-harnesses/integration.mjs' before merging."
