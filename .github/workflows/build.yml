name: Build All Packages

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'
  pull_request:
    # `ready_for_review` is NOT in the default type set (opened/synchronize/reopened),
    # and the job below skips while the PR is a draft — without it, marking a PR ready
    # would not re-trigger anything and the check would never report.
    types: [opened, synchronize, reopened, ready_for_review]
    # `main` included, and NO `paths` filter on the PR side. This context is required on
    # `main`, and a workflow filtered out at the `on:` level creates no check run at all —
    # a required context would then sit Pending forever. The release PR is also the one
    # merge that most needs a build: it is what publishes to npm.
    branches: [next, main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One condition, one exclusion, and the `push` arm has to come first: on a push
    # `github.event.pull_request` is null, so a bare draft comparison would skip the job on
    # every push to `next`.
    #
    #   * drafts — they DO fire opened/synchronize, so without this a draft burns a full run
    #     on every push; the `ready_for_review` trigger above brings the check back.
    #
    # The Version Packages PR used to be excluded here too, on the reasoning that it only
    # refreshed a lockfile nobody needed verified yet. It is now based on `main` and IS the
    # release PR, so this is precisely the build that must not be skipped: the first place
    # the refreshed lockfile meets --frozen-lockfile.
    #
    # A job skipped by `if:` still reports a conclusion, which satisfies a required check —
    # unlike a workflow filtered out at the `on:` level, which creates no check run at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      # Runs on every PR, not only at publish. validate-package-lock-case.sh is a release gate, so
      # a bug in the GATE would otherwise be discovered during a release — the one-level-up form of
      # the failure it exists to prevent, and exactly what happened: it could not detect a mis-cased
      # path at all. These fixtures drive the real script against throwaway repos, including the
      # mis-cased cases that fail without the fix.
      - name: CI guard script tests
        run: ./.github/scripts/__tests__/validate-package-lock-case.test.sh

      # Specs for the migration guards (and any repo-specific *.spec.mjs placed next to them).
      # Plain node:test, no dependencies, so it runs before the install.
      - name: CI guard specs
        run: node --test .github/scripts/__tests__/*.spec.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build and tests each REPORT, and the last step DECIDES. Failing at the build would skip the
      # tests and collapse the job view onto the build error; this way tests still run against
      # whatever compiled, and the summary table below shows both. (Pattern from bizapps-orders.)
      - name: Build all packages
        id: build
        run: |
          if pnpm run build:packages; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            echo "::error title=Build failed::One or more packages did not compile. Tests below ran against whatever did build."
          fi

      # The repo's own `test` script: per-package turbo or a root `vitest run`, whichever really
      # runs the suite. Packages that still echo a stub pass, so green means "nothing that has
      # tests is failing", not "tested".
      - name: Run tests
        id: unit
        if: always()
        run: |
          set -o pipefail
          if pnpm run test 2>&1 | tee /tmp/test.log; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      # The run's landing page: readable without expanding a log. Vitest colours its output on a
      # runner and the escape codes sit before the leading whitespace, so they are stripped
      # before matching. Totals are summed across packages (a turbo run prints one block each).
      - name: Summary
        if: always()
        run: |
          CLEAN=$( [ -f /tmp/test.log ] && perl -pe 's/\e\[[0-9;]*m//g' /tmp/test.log || true )
          FILES=$(printf '%s\n' "$CLEAN" | grep -E 'Test Files[[:space:]]' | sed -E 's/.*\(([0-9]+)\).*/\1/' | awk '{s+=$1} END {if (NR) print s}')
          TESTS=$(printf '%s\n' "$CLEAN" | grep -E '^[^|]*Tests[[:space:]]+[0-9]' | sed -E 's/.*\(([0-9]+)\).*/\1/' | awk '{s+=$1} END {if (NR) print s}')
          FAILED=$(printf '%s\n' "$CLEAN" | grep -E 'Tests[[:space:]]+.*[0-9]+ failed' | sed -E 's/.*[^0-9]([0-9]+) failed.*/\1/' | awk '{s+=$1} END {if (NR) print s}')
          {
            echo '## Build and test'
            echo
            echo '| step | result |'
            echo '| --- | --- |'
            if [ "${{ steps.build.outputs.ok }}" = 'true' ]; then echo '| Build (`build:packages`) | ✅ passed |'
            elif [ -z "${{ steps.build.outputs.ok }}" ]; then echo '| Build (`build:packages`) | ⚠️ did not run |'
            else echo '| Build (`build:packages`) | ❌ failed, see the Build step |'; fi
            if [ "${{ steps.unit.outputs.ok }}" = 'true' ]; then echo "| Tests | ✅ ${TESTS:-0} tests in ${FILES:-0} files |"
            elif [ -z "${{ steps.unit.outputs.ok }}" ]; then echo '| Tests | ⚠️ did not run |'
            else echo "| Tests | ❌ ${FAILED:-?} failed of ${TESTS:-?} (${FILES:-?} files), see the Run tests step |"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the build broke or tests failed
        if: always() && (steps.build.outputs.ok != 'true' || steps.unit.outputs.ok != 'true')
        run: exit 1
