name: PostgreSQL migration parity

# Validates that the T-SQL migrations in `migrations/` have working
# PostgreSQL counterparts in `migrations-pg/` that apply cleanly to a fresh
# PG database. Source of truth is SQL Server; PG is produced by the
# MemberJunction `sql-converter` toolchain. See `migrations-pg/README.md`.

# Release-time gate only. Feature PRs ship T-SQL migrations only; PG counterparts are
# transpiled converter output generated by the build engineer at release time.
# Running this gate on pull_request or push to next fails permanently whenever
# historical migrations lack PG counterparts.
#
# Orders' tables reference BizApps Common and Accounting, and Accounting
# references BizApps Tasks, so the database is built the way a PostgreSQL
# install builds it: MJ core, then each dependency's `migrations-pg/` in
# install order, then this app's.
on:
  workflow_dispatch:
    inputs:
      mj_tag:
        description: 'MJ core tag to install (the floor of mjVersionRange in mj-app.json)'
        default: 'v6.1.5'
      common_ref:
        description: 'bizapps-common ref whose migrations-pg/ is applied (blank = latest v* tag)'
        default: ''
      tasks_ref:
        description: 'bizapps-tasks ref whose migrations-pg/ is applied (blank = latest v* tag)'
        default: ''
      accounting_ref:
        description: 'bizapps-accounting ref whose migrations-pg/ is applied (blank = latest v* tag)'
        default: ''

# This workflow only reads the repo; never grant the default token more than that.
permissions:
  contents: read

concurrency:
  group: pg-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg-parity:
    name: PG migration parity check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Read by every `mj migrate` step below.
    env:
      DB_PLATFORM: postgresql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: bizapps_orders_ci
      DB_USERNAME: postgres
      DB_PASSWORD: testpass
      CODEGEN_DB_USERNAME: postgres
      CODEGEN_DB_PASSWORD: testpass
      DB_ENCRYPT: 'false'
      DB_TRUST_SERVER_CERTIFICATE: 'true'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: bizapps_orders_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      # ─── Validate filenames in both directories ─────────────────────
      - name: Validate T-SQL migration filenames
        run: ./.github/scripts/validate-migration-filenames.sh migrations

      - name: Validate PG migration filenames
        run: ./.github/scripts/validate-migration-filenames.sh migrations-pg

      # ─── Skip the heavy bits when there are no migrations yet ──────
      - name: Detect migrations
        id: detect
        run: |
          shopt -s nullglob
          TSQL=( migrations/*.sql )
          PG=( migrations-pg/*.sql )
          echo "tsql_count=${#TSQL[@]}" >> "$GITHUB_OUTPUT"
          echo "pg_count=${#PG[@]}"     >> "$GITHUB_OUTPUT"

      - name: Skip — no migrations present
        if: steps.detect.outputs.tsql_count == '0' && steps.detect.outputs.pg_count == '0'
        run: |
          echo "::notice::No migrations to validate. Skipping PG apply step."
          exit 0

      # ─── Ensure every T-SQL migration has a PG counterpart ─────────
      - name: Verify PG counterparts exist for every T-SQL migration
        if: steps.detect.outputs.tsql_count != '0'
        run: |
          missing=0
          for f in migrations/*.sql; do
            base=$(basename "$f" .sql)
            if [ ! -f "migrations-pg/${base}.pg.sql" ] && [ ! -f "migrations-pg/${base}.pg-only.sql" ]; then
              echo "::error file=$f::No PG counterpart found in migrations-pg/ (expected ${base}.pg.sql or ${base}.pg-only.sql)"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "Generate the missing files with:"
            echo "  pnpm exec mj sql-convert <file> --from tsql --to postgres \\"
            echo "    --output migrations-pg/<file>.pg.sql --schema __mj_BizAppsOrders"
            exit 1
          fi

      # ─── Apply PG migrations to fresh DB to verify they actually run ──
      - name: Install dependencies
        if: steps.detect.outputs.pg_count != '0'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The MJ core baseline grants to these roles; a fresh server has none of them.
      - name: Bootstrap PostgreSQL roles
        if: steps.detect.outputs.pg_count != '0'
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U postgres -d bizapps_orders_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE "cdp_UI" NOLOGIN;
          CREATE ROLE "cdp_Developer" NOLOGIN;
          CREATE ROLE "cdp_Integration" NOLOGIN;
          SQL

      # `mj` resolves from @memberjunction/cli, a root devDependency. With
      # DB_PLATFORM=postgresql, `--tag` fetches MJ's own migrations-pg/ at that tag.
      - name: Install MJ core
        if: steps.detect.outputs.pg_count != '0'
        env:
          MJ_TAG: ${{ inputs.mj_tag || 'v6.1.5' }}
        run: pnpm exec mj migrate --tag "$MJ_TAG"

      # Install order follows each app's mj-app.json dependencies:
      # Tasks depends on Common; Accounting depends on Common and Tasks.
      - name: Install BizApps dependencies
        if: steps.detect.outputs.pg_count != '0'
        env:
          COMMON_REF: ${{ inputs.common_ref }}
          TASKS_REF: ${{ inputs.tasks_ref }}
          ACCOUNTING_REF: ${{ inputs.accounting_ref }}
        run: |
          set -euo pipefail
          install_dep() {
            local app="$1" ref="$2" dir="$RUNNER_TEMP/bizapps-$1"
            if [ -z "$ref" ]; then
              ref=$(git ls-remote --tags --refs --sort=-v:refname "https://github.com/MemberJunction/bizapps-$app" 'v*' | head -1 | sed 's#.*refs/tags/##')
            fi
            git clone --quiet --depth 1 --branch "$ref" "https://github.com/MemberJunction/bizapps-$app" "$dir"
            local schema
            schema=$(node -p "require('$dir/mj-app.json').schema.name")
            echo "::group::bizapps-$app @ $ref -> $schema"
            pnpm exec mj migrate --schema "$schema" --dir "$dir/migrations-pg"
            echo "::endgroup::"
          }
          install_dep common "$COMMON_REF"
          install_dep tasks "$TASKS_REF"
          install_dep accounting "$ACCOUNTING_REF"

      - name: Apply this app's PG migrations
        if: steps.detect.outputs.pg_count != '0'
        run: pnpm exec mj migrate --verbose --schema __mj_BizAppsOrders --dir ./migrations-pg

      # ─── Smoke checks ──────────────────────────────────────────────
      # Skyway keeps its history table in the schema as named, while the
      # migrations' unquoted DDL folds to lowercase, so match case-insensitively
      # and leave the history table out of the count.
      - name: Verify schema exists
        if: steps.detect.outputs.pg_count != '0'
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U postgres -d bizapps_orders_ci -c \
            "SELECT count(*) AS tables FROM information_schema.tables WHERE lower(table_schema) = lower('__mj_BizAppsOrders') AND table_type = 'BASE TABLE' AND table_name <> 'flyway_schema_history';"
